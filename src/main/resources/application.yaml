spring:
  profiles:
    active: dev
#    active: prod
  application:
    name: Testing Automation
  config:
    import: optional:file:.env[.properties]




  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

server:
  port: 8088

runner:
  base-url: ${RUNNER_BASE_URL:http://localhost:8080}
  run-auth-path: /runner/run-auth
  timeout-seconds: ${RUNNER_TIMEOUT:120}

storage:
  s3:
    region: ${AWS_REGION}
    bucket-name: ${S3_BUCKET}
    base-prefix: ${S3_BASE_PREFIX}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    presigned-url-expiry-minutes: ${S3_PRESIGNED_EXPIRY_MINUTES:60}

llm:
  api:
    key: ${OPEN_AI_API_KEY}
    url: ${OPEN_AI_URL}

logging:
  level:
    root: INFO
    com.testingautomation.autotest: DEBUG
    org.springframework.data.mongodb: INFO

autotest:
  browser: chrome
  headless: false
  results:
    base-dir: ./test-results
  screenshot-dir: screenshots
  screenshot-on-step: true
  scanner:
    timeout-seconds: 15
    user-agent: "AutoTestScannerClient/1.0"
    pagination:
      default-page-size: 20
      max-page-size: 100
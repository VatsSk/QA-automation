<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QA Studio — Component Flow Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* ── Builder Layout ── */
        .builder-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .builder-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--sur);
            border-bottom: 1px solid var(--bd);
            flex-shrink: 0;
            gap: 16px;
        }

        .builder-topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .builder-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--tx);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .builder-meta-fields {
            display: flex;
            gap: 12px;
            flex: 1;
        }

        .builder-meta-fields .inp {
            flex: 1;
            min-width: 180px;
        }

        .builder-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .builder-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── Steps Panel (left) ── */
        .steps-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 1px solid var(--bd);
        }

        .steps-panel-header {
            padding: 14px 20px;
            background: var(--sur2);
            border-bottom: 1px solid var(--bd);
            font-weight: 600;
            font-size: 13px;
            color: var(--tx2);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .steps-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: var(--bg);
        }

        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            background: var(--sur);
            border: 1px solid var(--bd);
            border-radius: var(--r);
            margin-bottom: 8px;
            transition: border-color 0.15s, box-shadow 0.15s;
            position: relative;
        }

        .step-item:hover {
            border-color: var(--bd2);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .step-item.is-component {
            background: rgba(59, 130, 246, 0.06);
            border-color: rgba(59, 130, 246, 0.25);
        }

        .step-item.is-component:hover {
            border-color: rgba(59, 130, 246, 0.4);
        }

        .step-num {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--sur2);
            color: var(--tx3);
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .step-item.is-component .step-num {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .step-info {
            flex: 1;
            min-width: 0;
        }

        .step-label {
            font-weight: 600;
            font-size: 13px;
            color: var(--tx);
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .step-item.is-component .step-label {
            color: #3b82f6;
        }

        .step-sub {
            font-size: 11px;
            color: var(--tx3);
            font-family: 'JetBrains Mono', monospace;
        }

        .step-remove {
            opacity: 0;
            transition: opacity 0.15s;
            flex-shrink: 0;
        }

        .step-item:hover .step-remove {
            opacity: 1;
        }

        .step-empty {
            text-align: center;
            padding: 48px 20px;
            color: var(--tx3);
            font-size: 13px;
            border: 2px dashed var(--bd);
            border-radius: var(--rl);
            background: var(--sur);
        }

        .step-empty .ei {
            font-size: 36px;
            margin-bottom: 12px;
            opacity: 0.6;
        }

        /* ── Sidebar (right) ── */
        .builder-sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--sur);
            flex-shrink: 0;
        }

        .sidebar-section {
            border-bottom: 1px solid var(--bd);
        }

        .sidebar-section-header {
            padding: 12px 16px;
            font-weight: 600;
            font-size: 12px;
            color: var(--tx3);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .sidebar-section-header:hover {
            background: var(--sur2);
        }

        .sidebar-section-body {
            padding: 12px 16px;
        }

        /* Manual step form */
        .ms-field {
            margin-bottom: 10px;
        }

        .ms-field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--tx3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
        }

        /* Component selector */
        .comp-search-inp {
            width: 100%;
            margin-bottom: 8px;
        }

        .comp-list {
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid var(--bd);
            border-radius: var(--r);
            background: var(--inp);
        }

        .comp-item {
            padding: 8px 10px;
            border-bottom: 1px solid var(--bd);
            cursor: pointer;
            font-size: 12px;
            transition: background 0.1s;
        }

        .comp-item:last-child {
            border-bottom: none;
        }

        .comp-item:hover {
            background: var(--sur2);
        }

        .comp-item-name {
            font-weight: 600;
            color: var(--tx);
        }

        .comp-item-mod {
            color: var(--tx3);
            font-size: 11px;
            margin-top: 1px;
        }

        /* ── Loading overlay ── */
        .builder-loading {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            flex-direction: column;
            gap: 16px;
        }

        .builder-loading p {
            color: var(--tx3);
            font-size: 14px;
        }
    </style>
</head>
<body>
<div id="toasts"></div>
<div id="modal-root"></div>

<!-- Loading overlay -->
<div class="builder-loading" id="builder-loading">
    <div class="spinner"></div>
    <p>Loading component flow builder…</p>
</div>

<div class="builder-layout" id="builder-app" style="display:none">

    <!-- Top Bar -->
    <div class="builder-topbar">
        <div class="builder-topbar-left">
            <button class="btn btn-ghost btn-sm" onclick="cancelBuilder()" title="Back to flows">
                ← Back
            </button>
            <div class="builder-title">🧩 Component Flow Builder</div>
        </div>

        <div class="builder-meta-fields">
            <input id="cb-name" class="inp" placeholder="Flow Name *" style="min-width:200px;max-width:320px">
            <input id="cb-desc" class="inp" placeholder="Description (optional)" style="flex:1;max-width:400px">
        </div>

        <div class="builder-actions">
            <button class="btn btn-ghost" onclick="cancelBuilder()">Cancel</button>
            <button class="btn btn-primary" onclick="saveComponentFlow()" id="btn-save">
                💾 Save Flow
            </button>
        </div>
    </div>

    <!-- Body -->
    <div class="builder-body">

        <!-- Left: Steps sequence -->
        <div class="steps-panel">
            <div class="steps-panel-header">
                <span>Flow Execution Sequence</span>
                <span id="step-count-badge" class="badge badge-blue" style="display:none"></span>
            </div>
            <div class="steps-list" id="builder-items-list">
                <div class="step-empty">
                    <div class="ei">🧩</div>
                    <p>No steps added yet.</p>
                    <p style="margin-top:4px">Use the panel on the right to add components or manual steps.</p>
                </div>
            </div>
        </div>

        <!-- Right: Component sidebar -->
        <div class="builder-sidebar">
            <div class="sidebar-section" style="border-bottom: none; flex: 1; display: flex; flex-direction: column;">
                <div class="sidebar-section-header" style="cursor: default;">
                    <span>🧩 Add Component</span>
                </div>
                <div class="sidebar-section-body" style="display: flex; flex-direction: column; flex: 1; gap: 12px; overflow: hidden;">
                    
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-size: 11px; font-weight: 600; color: var(--tx3); text-transform: uppercase; letter-spacing: 0.06em;">Module</label>
                        <select id="module-dropdown" class="inp comp-search-inp" style="margin-bottom: 0;" onchange="fetchComponentsForModule()">
                            <option value="">-- Select Module --</option>
                        </select>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-size: 11px; font-weight: 600; color: var(--tx3); text-transform: uppercase; letter-spacing: 0.06em;">Search</label>
                        <input class="inp comp-search-inp" id="comp-search" style="margin-bottom: 0;" placeholder="🔍 Search components…" oninput="filterComponents()">
                    </div>

                    <div class="comp-list" id="comp-list" style="flex: 1; max-height: none; margin-bottom: 4px;">
                        <div style="text-align:center;padding:20px;color:var(--tx3);font-size:12px">
                            Select a module to view components
                        </div>
                    </div>
                    
                    <p style="font-size:11px;color:var(--tx3); text-align: center;">Click a component to add it to the sequence.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import * as api from './js/api.js';
    import { esc, toast, openModal, closeModal, requireLogin, initTheme, toggleTheme, buildSidebar } from './js/utils.js';

    window.toggleTheme = toggleTheme;
    window.closeModal  = closeModal;

    const user = requireLogin();
    if (!user) throw new Error('not logged in');

    initTheme();

    const params    = new URLSearchParams(location.search);
    const projectId = params.get('projectId');
    const moduleId  = params.get('moduleId');

    if (!projectId || !moduleId) {
        window.location.href = '/projects.html';
        throw new Error('Missing params');
    }

    // ── State ──────────────────────────────────────────────────────────────
    let builderItems = [];
    let compMods = [];
    let currentModuleComponents = [];
    let filteredComponents = [];

    // ── Boot ──────────────────────────────────────────────────────────────
    async function boot() {
        try {
            document.title = 'Component Flow Builder — QA Studio';

            // Load modules for dropdown
            await loadModules();

            // Show the app
            document.getElementById('builder-loading').style.display = 'none';
            document.getElementById('builder-app').style.display = '';
        } catch (e) {
            document.getElementById('builder-loading').innerHTML = `
                <div style="text-align:center;color:var(--tx3)">
                    <div style="font-size:36px;margin-bottom:12px">⚠️</div>
                    <p>Failed to initialize builder</p>
                    <p style="margin-top:4px;font-size:12px">${esc(e.message)}</p>
                    <button class="btn btn-primary" style="margin-top:16px" onclick="cancelBuilder()">← Back</button>
                </div>`;
        }
    }

    async function loadModules() {
        try {
            compMods = await api.components.listModules(projectId);
            const select = document.getElementById('module-dropdown');
            select.innerHTML = '<option value="">-- Select Module --</option>' + 
                compMods.map(m => `<option value="${m.id || m._id}">${esc(m.name)}</option>`).join('');
            
            // if there is only one module, select it automatically
            if (compMods.length === 1) {
                select.selectedIndex = 1;
                await fetchComponentsForModule();
            }
        } catch (e) {
            console.error('Failed to load modules', e);
            document.getElementById('comp-list').innerHTML =
                `<div style="text-align:center;padding:20px;color:var(--tx3);font-size:12px">Failed to load modules</div>`;
        }
    }

    window.fetchComponentsForModule = async function() {
        const modId = document.getElementById('module-dropdown').value;
        const list = document.getElementById('comp-list');
        
        if (!modId) {
            currentModuleComponents = [];
            filteredComponents = [];
            list.innerHTML = `<div style="text-align:center;padding:20px;color:var(--tx3);font-size:12px">Select a module to view components</div>`;
            return;
        }

        list.innerHTML = `<div style="text-align:center;padding:20px;color:var(--tx3);font-size:12px">Loading components…</div>`;
        try {
            const comps = await api.components.listComponents(projectId, modId);
            const selectedMod = compMods.find(m => (m.id || m._id) === modId);
            currentModuleComponents = comps.map(c => ({ ...c, compModuleName: selectedMod ? selectedMod.name : '' }));
            filteredComponents = [...currentModuleComponents];
            document.getElementById('comp-search').value = '';
            renderComponentList();
        } catch (e) {
            console.error('Failed to fetch components', e);
            list.innerHTML = `<div style="text-align:center;padding:20px;color:var(--tx3);font-size:12px">Failed to load components</div>`;
        }
    };

    // ── Component List ────────────────────────────────────────────────────
    function renderComponentList() {
        const list = document.getElementById('comp-list');
        if (!filteredComponents.length) {
            list.innerHTML = `<div style="text-align:center;padding:20px;color:var(--tx3);font-size:12px">
                ${currentModuleComponents.length === 0 ? 'No components found in this module' : 'No matches found'}
            </div>`;
            return;
        }
        list.innerHTML = filteredComponents.map(c => `
            <div class="comp-item" onclick="addComponent('${c.id || c._id}')">
                <div class="comp-item-name">🧩 ${esc(c.name)}</div>
                <div class="comp-item-mod">${esc(c.compModuleName)} · ${c.steps ? c.steps.length : 0} steps</div>
            </div>`).join('');
    }

    window.filterComponents = function() {
        const q = document.getElementById('comp-search').value.toLowerCase().trim();
        filteredComponents = !q
            ? [...currentModuleComponents]
            : currentModuleComponents.filter(c =>
                c.name.toLowerCase().includes(q)
            );
        renderComponentList();
    };

    window.addComponent = function(componentId) {
        const c = currentModuleComponents.find(x => (x.id || x._id) === componentId);
        if (!c) return;
        builderItems.push({ type: 'COMPONENT', componentId, component: c });
        renderBuilderItems();
        toast(`Added component: ${c.name}`, 'success');
    };

    // ── Builder Items ─────────────────────────────────────────────────────
    function renderBuilderItems() {
        const list = document.getElementById('builder-items-list');
        const badge = document.getElementById('step-count-badge');

        badge.textContent = `${builderItems.length} step${builderItems.length !== 1 ? 's' : ''}`;
        badge.style.display = builderItems.length ? '' : 'none';

        if (!builderItems.length) {
            list.innerHTML = `
                <div class="step-empty">
                    <div class="ei">🧩</div>
                    <p>No components added yet.</p>
                    <p style="margin-top:4px">Use the panel on the right to add components.</p>
                </div>`;
            return;
        }

        list.innerHTML = builderItems.map((item, index) => {
            const c = item.component;
            const cName = c ? c.name : 'Unknown Component';
            const stepCount = c && c.steps ? c.steps.length : 0;
            return `
            <div class="step-item is-component">
                <div class="step-num">${index + 1}</div>
                <div class="step-info">
                    <div class="step-label">🧩 ${esc(cName)}</div>
                    <div class="step-sub">Component · expands to ${stepCount} step${stepCount !== 1 ? 's' : ''} at runtime${c ? ' · ' + esc(c.compModuleName) : ''}</div>
                </div>
                <button class="btn btn-danger btn-xs step-remove" onclick="removeBuilderItem(${index})" title="Remove">✕</button>
            </div>`;
        }).join('');
    }

    window.removeBuilderItem = function(index) {
        builderItems.splice(index, 1);
        renderBuilderItems();
    };

    // ── Save ──────────────────────────────────────────────────────────────
    window.saveComponentFlow = async function() {
        const name = document.getElementById('cb-name').value.trim();
        const desc = document.getElementById('cb-desc').value.trim();

        if (!name) { toast('Flow Name is required', 'warning'); document.getElementById('cb-name').focus(); return; }
        if (!builderItems.length) { toast('Add at least one step or component', 'warning'); return; }

        const btn = document.getElementById('btn-save');
        btn.disabled = true;
        btn.textContent = 'Saving…';

        try {
            const flowItems = builderItems.map((item, idx) => {
                if (item.type === 'STEP') {
                    item.step.stepOrder = idx + 1;
                    return { order: idx + 1, type: 'STEP', step: item.step };
                } else {
                    return { order: idx + 1, type: 'COMPONENT', componentId: item.componentId };
                }
            });

            const flowInfoData = {
                name: name,
                description: desc,
                projectId: projectId,
                moduleId: moduleId,
                containsComp: true,
                flowItems: flowItems
            };

            await api.components.createFlowInfo(flowInfoData);

            toast('Component Flow saved successfully!', 'success');
            setTimeout(() => {
                window.location.href = `/flows.html?projectId=${projectId}&moduleId=${moduleId}&flowTab=component`;
            }, 800);
        } catch (e) {
            toast('Failed to save flow: ' + e.message, 'error');
            btn.disabled = false;
            btn.innerHTML = '💾 Save Flow';
        }
    };

    // ── Cancel ────────────────────────────────────────────────────────────
    window.cancelBuilder = function() {
        window.location.href = `/flows.html?projectId=${projectId}&moduleId=${moduleId}&flowTab=component`;
    };

    boot();
</script>
</body>
</html>

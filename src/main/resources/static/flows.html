<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QA Studio — Flows</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .page-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--bd); margin-bottom: 0; }
        .tab-btn {
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 10px 18px;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--tx2);
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
            margin-bottom: -1px;
        }
        .tab-btn:hover { color: var(--tx); }
        .tab-btn.active { color: var(--pri); border-bottom-color: var(--pri); }
    </style>
</head>
<body>
<div id="toasts"></div>

<div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-col">

        <div class="topbar">
            <div class="crumb">
                <a class="crumb-link" href="/projects.html">Projects</a>
                <span class="crumb-sep">›</span>
                <span class="crumb-link" id="crumb-proj" style="cursor:pointer">…</span>
                <span class="crumb-sep">›</span>
                <span class="crumb-cur" id="crumb-mod">…</span>
                <span class="crumb-sep" id="crumb-sub-sep" style="display:none">›</span>
                <span class="crumb-cur" id="crumb-sub" style="display:none"></span>
            </div>
            <div class="topbar-right">
                <button class="btn-icon theme-btn" onclick="toggleTheme()">☀</button>
            </div>
        </div>

        <div class="main-scroll">
            <div class="page">

                <!-- Page Header -->
                <div class="page-header row-between" style="margin-bottom:0">
                    <div>
                        <div class="page-title" id="page-title">Module</div>
                        <div class="page-sub" id="page-sub">Loading…</div>
                    </div>
                    <div id="workspace-actions" style="display:flex;gap:8px;align-items:center">
                        <!-- populated by switchWorkspaceTab() -->
                    </div>
                </div>

                <!-- ═══ UNIFIED MODULE PANEL ════════════════════════════════════ -->
                <div id="ws-panel-flows" style="padding-top:8px">

                    <!-- Flow Sub-Tabs: Standard | Component (hidden in runs mode) -->
                    <div id="flow-tab-bar" style="display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:16px;margin-top:16px">
                        <button class="tab-btn active" id="flow-tab-standard" onclick="switchFlowTab('standard')">Standard Flows</button>
                        <button class="tab-btn" id="flow-tab-component" onclick="switchFlowTab('component')">🧩 Component Flows</button>
                    </div>

                    <!-- Filter bar (Standard) -->
                    <div class="filter-bar" id="standard-filter-bar">
                        <div class="filter-sep"></div>
                        <input class="inp inp-sm" style="width:220px" id="search-inp"
                               placeholder="🔍 Search by name…">
                    </div>

                    <!-- Standard flows content -->
                    <div id="flows-content">
                        <div class="spinner-wrap"><div class="spinner"></div></div>
                    </div>

                    <!-- Component flows panel -->
                    <div id="comp-flows-content" style="display:none">
                        <div class="spinner-wrap"><div class="spinner"></div></div>
                    </div>

                    <!-- Runs panel (only shown when view=runs, flow tabs are hidden) -->
                    <div id="ws-panel-runs" style="display:none">
                        <div class="filter-bar">
                            <div class="status-filters" id="status-filters"></div>
                            <div class="filter-sep"></div>
                            <input class="inp inp-sm" style="width:220px" id="runs-search-inp"
                                   placeholder="🔍 Search by name…">
                        </div>
                        <div id="runs-content">
                            <div class="spinner-wrap"><div class="spinner"></div></div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>

<script type="module">
    import * as api from './js/api.js';

    import { esc, statusBadge, timeAgo, toast,
        requireLogin, logout, initTheme, toggleTheme,
        buildSidebar, paginationHTML, debounce, openModal, closeModal } from './js/utils.js';

    window.toggleTheme = toggleTheme;
    window.closeModal = closeModal;

    const user = requireLogin();
    if (!user) throw new Error('not logged in');

    initTheme();
    buildSidebar('flows', api);

    const params    = new URLSearchParams(location.search);
    const projectId = params.get('projectId');
    const moduleId  = params.get('moduleId');
    if (!projectId || !moduleId) { window.location.href = '/projects.html'; }

    // ── State ─────────────────────────────────────────────────────────────────
    let flowFilter = { search: '', page: 0, size: 20 };
    let allFlowsCache = null;
    let environmentsCache = [];

    // Runs state
    const STATUSES = ['', 'DRAFT', 'RUNNING', 'PASSED', 'FAILED', 'PARTIAL'];
    const STATUS_LABELS = { '': 'All', DRAFT: 'Draft', RUNNING: 'Running', PASSED: 'Passed', FAILED: 'Failed', PARTIAL: 'Partial' };
    let runFilter = { status: '', search: '', page: 0, size: 20 };
    let allRunsCache = null;
    let runsLoaded = false;
    let compFlowsLoaded = false;

    // ── Boot ─────────────────────────────────────────────────────────────────
    async function boot() {
        try {
            const [proj, mod] = await Promise.all([
                api.projects.get(projectId),
                api.modules.get(moduleId),
            ]);
            document.getElementById('crumb-proj').textContent = proj.name;
            document.getElementById('crumb-proj').onclick = () =>
                window.location.href = `/modules.html?projectId=${projectId}`;
            document.getElementById('crumb-mod').textContent  = mod.name;
            document.getElementById('page-title').textContent = mod.name;
            document.title = `${mod.name} — QA Studio`;
        } catch { /* breadcrumbs stay as '…' */ }

        // Pre-load environments
        try { environmentsCache = await api.environments.list(projectId); } catch { environmentsCache = []; }

        // Determine initial view from URL params
        const initView    = params.get('view');      // 'runs' or null
        const initFlowTab = params.get('flowTab');   // 'component' or null

        if (initView === 'runs') {
            // ── Runs mode: hide ALL flow tabs, show only Runs panel ──
            document.getElementById('flow-tab-bar').style.display    = 'none';
            document.getElementById('standard-filter-bar').style.display = 'none';
            document.getElementById('flows-content').style.display   = 'none';
            document.getElementById('comp-flows-content').style.display = 'none';
            document.getElementById('ws-panel-runs').style.display   = '';
            document.getElementById('workspace-actions').innerHTML =
                `<button class="btn btn-success" onclick="newRun()">+ New Run</button>`;
            initRuns();
        } else {
            // ── Flows mode: show flow tabs, no Runs panel ──
            if (initFlowTab === 'component') {
                switchFlowTab('component', true);
            } else {
                switchFlowTab('standard', true);
            }
            wireFlowSearch();
            await ensureAllFlowsLoaded();
            renderFilteredFlows();
        }
    }

    // ── Flow Sub-Tab Switching (Standard | Component only — no Runs) ──────
    window.switchFlowTab = function(subTab, skipHistory) {
        const stdBtn  = document.getElementById('flow-tab-standard');
        const compBtn = document.getElementById('flow-tab-component');
        const stdContent  = document.getElementById('flows-content');
        const compContent = document.getElementById('comp-flows-content');
        const filterBar   = document.getElementById('standard-filter-bar');
        const actions     = document.getElementById('workspace-actions');
        const crumbSep    = document.getElementById('crumb-sub-sep');
        const crumbSub    = document.getElementById('crumb-sub');

        // Reset
        [stdBtn, compBtn].forEach(b => b.classList.remove('active'));
        stdContent.style.display  = 'none';
        compContent.style.display = 'none';
        filterBar.style.display   = 'none';
        crumbSep.style.display    = 'none';
        crumbSub.style.display    = 'none';

        if (subTab === 'component') {
            compBtn.classList.add('active');
            compContent.style.display = '';
            actions.innerHTML = `<button class="btn btn-primary" onclick="newComponentFlow()">+ New Component Flow</button>`;
            if (!compFlowsLoaded) loadComponentFlows();
        } else {
            // default: standard
            stdBtn.classList.add('active');
            stdContent.style.display = '';
            filterBar.style.display  = '';
            actions.innerHTML = `<button class="btn btn-success" onclick="newFlow()">+ New Flow</button>`;
        }

        if (!skipHistory) {
            const url = new URL(window.location);
            if (subTab === 'component') {
                url.searchParams.set('flowTab', 'component');
            } else {
                url.searchParams.delete('flowTab');
            }
            url.searchParams.delete('view');
            window.history.replaceState({}, '', url);
        }
    };

    let standardFlowsCache = null;
    let componentFlowsCache = null;

    async function fetchFlows(isPartComp) {
        const resp = await api.flows.list(projectId, moduleId, isPartComp);
        if (Array.isArray(resp)) return resp;
        return resp?.results ?? resp?.content ?? [];
    }

    async function ensureStandardFlowsLoaded(force = false) {
        if (standardFlowsCache && !force) return standardFlowsCache;
        try {
            document.getElementById('flows-content').innerHTML = `<div class="empty"><div class="ei">⏳</div><h3>Loading flows…</h3></div>`;
            standardFlowsCache = await fetchFlows(false);
            return standardFlowsCache;
        } catch (e) {
            console.error('Fetch standard flows failed:', e);
            standardFlowsCache = [];
            throw e;
        }
    }

    async function ensureComponentFlowsLoaded(force = false) {
        if (componentFlowsCache && !force) return componentFlowsCache;
        try {
            document.getElementById('comp-flows-content').innerHTML = `<div class="spinner-wrap"><div class="spinner"></div></div>`;
            componentFlowsCache = await fetchFlows(true);
            return componentFlowsCache;
        } catch (e) {
            console.error('Fetch component flows failed:', e);
            componentFlowsCache = [];
            throw e;
        }
    }

    async function ensureAllFlowsLoaded(force = false) {
        await Promise.all([
            ensureStandardFlowsLoaded(force),
            ensureComponentFlowsLoaded(force)
        ]);
    }

    // ── Component Flows (filter by containsComp flag) ────────────────────────
    async function loadComponentFlows() {
        compFlowsLoaded = true;
        const content = document.getElementById('comp-flows-content');
        content.innerHTML = `<div class="spinner-wrap"><div class="spinner"></div></div>`;
        try {
            const compFlows = await ensureComponentFlowsLoaded();
            if (!compFlows.length) {
                content.innerHTML = `
                    <div class="empty">
                        <div class="ei">🧩</div>
                        <h3>No component flows yet</h3>
                        <p>Create a flow using reusable components.</p>
                        <button class="btn btn-success" onclick="newComponentFlow()">+ New Component Flow</button>
                    </div>`;
                return;
            }
            renderFlowTable(content, compFlows);
        } catch(e) {
            content.innerHTML = `<div class="empty"><div class="ei">⚠️</div><h3>Failed to load</h3><p>${esc(e.message)}</p></div>`;
        }
    }

    function renderFlowTable(container, flows) {
        const rows = flows.map(f => {
            const fid  = f.id || f._id;
            const name = f.flowName || f.name || '—';
            const duration = calcFlowDuration(f);
            return `
            <tr>
              <td><span class="run-name-link" onclick="viewFlow('${fid}')">${esc(name)}</span></td>
              <td>${statusBadge(f.executionStatus)}</td>
              <td><span class="mono-sm">${f.scenariosList?.length ?? f.steps?.length ?? 0}</span></td>
              <td><span class="mono-sm">${duration}</span></td>
              <td><span class="mono-sm">${timeAgo(f.updatedAt || f.createdAt)}</span></td>
              <td>
                <div class="actions-cell">
                  <button class="btn btn-ghost btn-xs" onclick="viewFlow('${fid}')" title="View">👁️</button>
                  <button class="btn btn-ghost btn-xs" onclick="editFlow('${fid}')" title="Edit">✏️</button>
                  <button class="btn btn-ghost btn-xs" onclick="cloneFlow('${fid}')" title="Clone">📋</button>
                  <button class="btn btn-amber btn-xs" onclick="executeFlow('${fid}')" title="Execute" ${f.executionStatus === 'RUNNING' ? 'style="display:none"' : ''}>▶</button>
                  <button class="btn btn-danger btn-xs" onclick="stopFlowExecution('${fid}')" title="Stop" ${f.executionStatus === 'RUNNING' ? '' : 'style="display:none"'}>⏹</button>
                  <button class="btn btn-danger btn-xs" onclick="deleteFlow('${fid}')" title="Delete">🗑️</button>
                </div>
              </td>
            </tr>`;
        }).join('');

        container.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th>Flow Name</th><th>Status</th><th>Steps</th><th>Duration</th><th>Last Updated</th><th>Actions</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;
    }

    // ── Search wiring (flows) ────────────────────────────────────────────────
    function wireFlowSearch() {
        const inp = document.getElementById('search-inp');
        inp.addEventListener('input', debounce(e => {
            flowFilter.search = e.target.value.trim();
            flowFilter.page   = 0;
            renderFilteredFlows();
        }, 350));
    }

    function matchesFlowSearch(f, q) {
        if (!q) return true;
        q = q.toLowerCase();
        if ((f.flowName || f.name || '').toLowerCase().includes(q)) return true;
        if ((f.id || f._id || '').toString().toLowerCase().includes(q)) return true;
        return false;
    }

    function formatDuration(ms) {
        if (!ms && ms !== 0) return '—';
        if (ms < 1000) return `${ms}ms`;
        if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
        const m = Math.floor(ms / 60000);
        const s = Math.round((ms % 60000) / 1000);
        return `${m}m ${s}s`;
    }

    function calcFlowDuration(f) {
        let duration = f.executionTime;
        if (!duration && f.executionCompletedAt && f.executionStartedAt) {
            duration = new Date(f.executionCompletedAt) - new Date(f.executionStartedAt);
        }
        return formatDuration(duration);
    }

    async function renderFilteredFlows() {
        const standard = await ensureStandardFlowsLoaded();
        const filtered = standard.filter(f => matchesFlowSearch(f, flowFilter.search));

        const total = filtered.length;
        const size  = flowFilter.size || 20;
        const totalPages = Math.max(1, Math.ceil(total / size));
        const page = Math.max(0, Math.min(flowFilter.page || 0, totalPages - 1));
        const pageItems = filtered.slice(page * size, page * size + size);

        document.getElementById('page-sub').textContent = `${total} flow${total !== 1 ? 's' : ''}`;

        const content = document.getElementById('flows-content');

        if (!pageItems.length) {
            content.innerHTML = `
            <div class="empty">
              <div class="ei">🔁</div>
              <h3>No flows found</h3>
              <p>${flowFilter.search ? 'Try adjusting your search.' : 'Create your first flow to start automating.'}</p>
              ${!flowFilter.search ? `<button class="btn btn-success" onclick="newFlow()">+ New Flow</button>` : ''}
            </div>`;
            return;
        }

        renderFlowTable(content, pageItems);
        content.insertAdjacentHTML('beforeend', paginationHTML(page, totalPages, 'goFlowPage'));
    }

    window.goFlowPage = p => { flowFilter.page = p; renderFilteredFlows(); };

    // ── New Flow (type selector modal) ───────────────────────────────────────
    window.newFlow = function () {
        openModal(`
      <div class="modal">
        <div class="modal-head">
          <h2>🔁 Create New Flow</h2>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;padding:20px 0">
          <button class="btn btn-primary btn-lg"
                  onclick="launchFlowRecorder()"
                  style="justify-content:flex-start;gap:12px">
            <span style="font-size:24px">🎯</span>
            <div style="text-align:left">
              <div style="font-weight:600">Smart Recorder</div>
              <div style="font-size:12px;opacity:0.7">Record a new Standard Flow using the Chrome extension</div>
            </div>
          </button>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        </div>
      </div>`);
    };

    window.newComponentFlow = function() {
        openModal(`
      <div class="modal">
        <div class="modal-head">
          <h2>🧩 Create Component Flow</h2>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;padding:20px 0">
          <button class="btn btn-primary btn-lg"
                  onclick="closeModal();launchComponentFlowRecorder()"
                  style="justify-content:flex-start;gap:12px">
            <span style="font-size:24px">🎯</span>
            <div style="text-align:left">
              <div style="font-weight:600">Launch Extension</div>
              <div style="font-size:12px;opacity:0.7">Record via Chrome extension</div>
            </div>
          </button>
          <button class="btn btn-secondary btn-lg"
                  onclick="closeModal();createManualComponentFlow()"
                  style="justify-content:flex-start;gap:12px">
            <span style="font-size:24px">✏️</span>
            <div style="text-align:left">
              <div style="font-weight:600">Manual Comp Flow Create</div>
              <div style="font-size:12px;opacity:0.7">Build flow step-by-step in full page editor</div>
            </div>
          </button>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        </div>
      </div>`);
    };

    window.createManualComponentFlow = function() {
        window.location.href = `/flow-builder.html?projectId=${projectId}&moduleId=${moduleId}`;
    };

    window.launchComponentFlowRecorder = async function () {
        closeModal();
        try {
            const projectData = await fetch(`/api/projects/url/${projectId}`).then(r => {
                if (!r.ok) throw new Error('Failed to fetch project');
                return r.json();
            });

            let extensionId;
            try {
                const res = await api.users.getExtensionId(user.username);
                extensionId = res.extensionId;
            } catch (e) {
                console.error('Failed to fetch extension ID', e);
            }

            if (!extensionId) {
                toast('Please configure your Chrome Extension ID from the Projects page.', 'warning', 5000);
                return;
            }

            if (!window.chrome || !window.chrome.runtime) {
                toast('Chrome extension is not installed or not accessible from this page.', 'error', 5000);
                return;
            }

            chrome.runtime.sendMessage(
                extensionId,
                {
                    action: "START_RECORDING",
                    projectId,
                    compModuleId: moduleId,
                    name: 'Untitled Component Flow',
                    description: '',
                    createdBy: user.username,
                    url: projectData.loginUrl,
                    flag: "COMPONENT"
                },
                (res) => {
                    if (chrome.runtime.lastError) {
                        console.error("Extension message failed:", chrome.runtime.lastError.message);
                        toast('Failed to connect to extension. Please check extension ID.', 'error', 5000);
                        return;
                    }
                    console.log("Extension ack:", res);
                    setTimeout(() => {
                        toast('window is already open close it to open new one', 'error', 10000);
                    }, 1000);
                }
            );
        } catch (e) {
            toast('Failed to start flow recorder: ' + e.message, 'error');
        }
    };

    // ── Launch Smart Recorder ────────────────────────────────────────────────
    window.launchFlowRecorder = async function () {
        closeModal();
        try {
            const projectData = await fetch(`/api/projects/url/${projectId}`).then(r => {
                if (!r.ok) throw new Error('Failed to fetch project');
                return r.json();
            });

            let extensionId;
            try {
                const res = await api.users.getExtensionId(user.username);
                extensionId = res.extensionId;
            } catch (e) {
                console.error('Failed to fetch extension ID', e);
            }

            if (!extensionId) {
                toast('Please configure your Chrome Extension ID from the Projects page.', 'warning', 5000);
                return;
            }

            if (!window.chrome || !window.chrome.runtime) {
                toast('Chrome extension is not installed or not accessible from this page.', 'error', 5000);
                return;
            }

            chrome.runtime.sendMessage(
                extensionId,
                {
                    action: "START_RECORDING",
                    projectId,
                    moduleId,
                    createdBy: user.username,
                    url: projectData.loginUrl,
                    flag: "FLOW"
                },
                (res) => {
                    if (chrome.runtime.lastError) {
                        console.error("Extension message failed:", chrome.runtime.lastError.message);
                        toast('Failed to connect to extension. Please check extension ID.', 'error', 5000);
                        return;
                    }
                    console.log("Extension ack:", res);
                    setTimeout(() => {
                        toast('window is already open close it to open new one', 'error', 10000);
                    }, 1000);
                }
            );
        } catch (e) {
            toast('Failed to start flow recorder: ' + e.message, 'error');
        }
    };

    // ── Edit Flow (launch Smart Recorder with existing flow) ─────────────────
    window.editFlow = async function (id) {
        try {
            const [projectData, flowData] = await Promise.all([
                fetch(`/api/projects/url/${projectId}`).then(r => { if (!r.ok) throw new Error('Failed to fetch project'); return r.json(); }),
                api.flows.get(id)
            ]);

            let extensionId;
            try {
                const res = await api.users.getExtensionId(user.username);
                extensionId = res.extensionId;
            } catch (e) {
                console.error('Failed to fetch extension ID', e);
            }

            if (!extensionId) {
                toast('Please configure your Chrome Extension ID from the Projects page.', 'warning', 5000);
                return;
            }

            if (!window.chrome || !window.chrome.runtime) {
                toast('Chrome extension is not installed or not accessible from this page.', 'error', 5000);
                return;
            }

            chrome.runtime.sendMessage(
                extensionId,
                {
                    action: "START_RECORDING",
                    projectId,
                    moduleId,
                    flowId: id,
                    createdBy: user.username,
                    url: projectData.loginUrl,
                    existingFlow: flowData,
                    flag: "FLOW"
                },
                (res) => {
                    if (chrome.runtime.lastError) {
                        console.error("Extension message failed:", chrome.runtime.lastError.message);
                        toast('Failed to connect to extension', 'error');
                        return;
                    }
                    console.log("Extension ack:", res);
                    setTimeout(() => {
                        toast('window is already open close it to open new one', 'error', 10000);
                    }, 1000);
                }
            );
        } catch (e) {
            toast('Edit flow failed: ' + e.message, 'error');
        }
    };

    window.viewFlow = function (id) {
        window.location.href = `/flow-detail.html?flowId=${id}&projectId=${projectId}&moduleId=${moduleId}`;
    };

    async function refreshFlowCacheAndRender() {
        allFlowsCache = null;
        compFlowsLoaded = false;
        await ensureAllFlowsLoaded(true);
        renderFilteredFlows();
    }

    window.cloneFlow = async function (id) {
        try {
            await api.flows.clone(id);
            toast('Flow cloned successfully', 'success');
            await refreshFlowCacheAndRender();
        } catch (e) { toast('Clone failed: ' + e.message, 'error'); }
    };

    // ── Environment selector modal helper ────────────────────────────────────
    function buildEnvOptions(selectedId) {
        const hasEnvs = environmentsCache.length > 0;
        if (!hasEnvs) {
            return `<p style="color:var(--tx3);font-size:13px;margin:0">
                No environments configured for this project.<br>
                The flow will execute using the recorded URLs.
            </p>`;
        }
        const opts = environmentsCache.map(e => {
            const checked = (selectedId && e.id === selectedId) || (!selectedId && e.defaultEnv) ? 'checked' : '';
            return `
            <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;
                         border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;
                         transition:background 0.15s" class="env-opt-label">
                <input type="radio" name="env-select" value="${esc(e.id)}" ${checked}
                       style="accent-color:var(--pri);width:16px;height:16px">
                <div>
                    <div style="font-weight:600;font-size:13px">${esc(e.name)}</div>
                    <div style="font-size:11px;color:var(--tx3);font-family:monospace">${esc(e.baseUrl)}</div>
                </div>
                ${e.defaultEnv ? '<span style="margin-left:auto" class="badge badge-blue">Default</span>' : ''}
            </label>`;
        }).join('');
        return `
        <div style="display:flex;flex-direction:column;gap:8px">${opts}</div>
        <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;
                      border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;margin-top:4px"
               class="env-opt-label">
            <input type="radio" name="env-select" value="" style="accent-color:var(--pri);width:16px;height:16px">
            <div>
                <div style="font-weight:600;font-size:13px">🔗 No Environment</div>
                <div style="font-size:11px;color:var(--tx3)">Use recorded URLs as-is</div>
            </div>
        </label>`;
    }

    function getSelectedEnvId() {
        const sel = document.querySelector('input[name="env-select"]:checked');
        return sel ? sel.value : null;
    }

    window.executeFlow = async function (id) {
        openModal(`
        <div class="modal">
            <div class="modal-head">
                <h2>▶ Run Flow</h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div style="padding:16px 0">
                <div style="font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em">Select Environment</div>
                ${buildEnvOptions(null)}
            </div>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
                <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmExecuteFlow('${id}')">▶ Run</button>
            </div>
        </div>`);
    };

    window.confirmExecuteFlow = async function(id) {
        const envId = getSelectedEnvId() || null;
        closeModal();
        try {
            toast('Starting flow…', 'info', 2000);
            await api.flows.execute(id, envId);
            toast('Flow execution started', 'success');
        } catch (e) { toast('Execute failed: ' + e.message, 'error'); }
    };

    window.stopFlowExecution = function (id) {
        openModal(`
            <div class="modal">
                <div class="modal-head">
                    <h2>⏹ Stop Execution</h2>
                    <button class="modal-close" onclick="closeModal()">✕</button>
                </div>
                <div style="padding: 20px 0;">
                    <p style="margin: 0; font-size: 14px; color: var(--tx2);">Are you sure you want to stop execution of this flow?</p>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
                    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-danger" onclick="confirmStopFlowExecution('${id}')">Stop</button>
                </div>
            </div>
        `);
    };

    window.confirmStopFlowExecution = async function (id) {
        closeModal();
        try {
            await api.flows.stop(id);
            toast('Flow execution stopped', 'warning');
            await refreshFlowCacheAndRender();
        } catch (e) { toast('Stop failed: ' + e.message, 'error'); }
    };

    window.deleteFlow = function (id) {
        openModal(`
            <div class="modal">
                <div class="modal-head">
                    <h2>🗑️ Delete Flow</h2>
                    <button class="modal-close" onclick="closeModal()">✕</button>
                </div>
                <div style="padding: 20px 0;">
                    <p style="margin: 0; font-size: 14px; color: var(--tx2);">Are you sure you want to delete this flow? This cannot be undone.</p>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
                    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-danger" onclick="confirmDeleteFlow('${id}')">Delete</button>
                </div>
            </div>
        `);
    };

    window.confirmDeleteFlow = async function (id) {
        closeModal();
        try {
            await api.flows.remove(id);
            toast('Flow deleted', 'info');
            await refreshFlowCacheAndRender();
        } catch (e) { toast('Delete failed: ' + e.message, 'error'); }
    };

    // ════════════════════════════════════════════════════════════════════════
    // ═══ RUNS TAB LOGIC ════════════════════════════════════════════════════
    // ════════════════════════════════════════════════════════════════════════

    async function initRuns() {
        runsLoaded = true;
        buildRunStatusFilters();
        wireRunSearch();
        await ensureAllRunsLoaded();
        renderFilteredRuns();
    }

    async function fetchAllRuns() {
        const pageSize = 100;
        let page = 0;
        let all = [];
        while (true) {
            const resp = await api.runs.list(projectId, moduleId, { page, size: pageSize });
            const data = resp?.results ? resp : (resp?.data?.results ? resp.data : resp);
            const items = data?.results ?? [];
            all.push(...items);
            if (data?.totalPages !== undefined) {
                if (page >= (data.totalPages - 1)) break;
            } else {
                if (items.length < pageSize) break;
            }
            page++;
        }
        return all;
    }

    async function ensureAllRunsLoaded(force = false) {
        if (allRunsCache && !force) return allRunsCache;
        try {
            document.getElementById('runs-content').innerHTML = `<div class="empty"><div class="ei">⏳</div><h3>Loading runs…</h3></div>`;
            const all = await fetchAllRuns();
            allRunsCache = all;
            return allRunsCache;
        } catch (e) {
            console.error('Fetch all runs failed:', e);
            allRunsCache = [];
            throw e;
        }
    }

    function buildRunStatusFilters() {
        const bar = document.getElementById('status-filters');
        bar.innerHTML = STATUSES.map(s => {
            const cls = runFilter.status === s ? `sel-${(s || 'all').toLowerCase()}` : '';
            return `<button class="sf-btn ${cls}" data-status="${s}"
        onclick="setRunStatus('${s}')">${STATUS_LABELS[s] || s}</button>`;
        }).join('');
    }

    window.setRunStatus = function (s) {
        runFilter.status = s;
        runFilter.page   = 0;
        buildRunStatusFilters();
        renderFilteredRuns();
    };

    function wireRunSearch() {
        const inp = document.getElementById('runs-search-inp');
        inp.addEventListener('input', debounce(e => {
            runFilter.search = e.target.value.trim();
            runFilter.page   = 0;
            renderFilteredRuns();
        }, 350));
    }

    function matchesRunSearch(r, q) {
        if (!q) return true;
        q = q.toLowerCase();
        if ((r.runName || '').toLowerCase().includes(q)) return true;
        if ((r.runType || '').toLowerCase().includes(q)) return true;
        if ((r.status || '').toLowerCase().includes(q)) return true;
        if ((r.id || r._id || '').toString().toLowerCase().includes(q)) return true;
        if (Array.isArray(r.tags)) {
            for (const t of r.tags) if ((t || '').toLowerCase().includes(q)) return true;
        }
        return false;
    }

    function renderFilteredRuns() {
        const all = allRunsCache || [];
        const filtered = all.filter(r => {
            if (runFilter.status && r.status !== runFilter.status) return false;
            if (!matchesRunSearch(r, runFilter.search)) return false;
            return true;
        });

        const total = filtered.length;
        const size  = runFilter.size || 20;
        const totalPages = Math.max(1, Math.ceil(total / size));
        const page = Math.max(0, Math.min(runFilter.page || 0, totalPages - 1));
        const pageItems = filtered.slice(page * size, page * size + size);

        document.getElementById('page-sub').textContent = `${total} run${total !== 1 ? 's' : ''}`;

        const content = document.getElementById('runs-content');

        if (!pageItems.length) {
            content.innerHTML = `
            <div class="empty">
              <div class="ei">▶</div>
              <h3>No runs found</h3>
              <p>${runFilter.search || runFilter.status ? 'Try adjusting your filters.' : 'Create your first run to start testing.'}</p>
              ${!runFilter.search && !runFilter.status ? `<button class="btn btn-success" onclick="newRun()">+ New Run</button>` : ''}
            </div>`;
            return;
        }

        const rows = pageItems.map(r => {
            const rid  = r.id || r._id;
            const tags = (r.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
            return `
            <tr>
              <td><span class="run-name-link" onclick="viewRun('${rid}')">${esc(r.runName || '—')}</span></td>
              <td>${statusBadge(r.status)}</td>
              <td><span class="mono-sm">${esc(r.runType || '—')}</span></td>
              <td><span class="mono-sm">${timeAgo(r.updatedAt || r.createdAt)}</span></td>
              <td><div style="display:flex;flex-wrap:wrap;gap:3px">${tags}</div></td>
              <td>
                <div class="actions-cell">
                  <button class="btn btn-ghost btn-xs" onclick="viewRun('${rid}')" title="View">👁</button>
                  <button class="btn btn-ghost btn-xs" onclick="editRun('${rid}')" title="Edit">✏️</button>
                  <button class="btn btn-ghost btn-xs" onclick="cloneRun('${rid}')" title="Clone">📋</button>
                  <button class="btn btn-amber btn-xs" onclick="runNow('${rid}')" title="Run">▶</button>
                  <button class="btn btn-danger btn-xs" onclick="deleteRun('${rid}')" title="Delete">🗑️</button>
                </div>
              </td>
            </tr>`;
        }).join('');

        content.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th>Run Name</th><th>Status</th><th>Type</th><th>Last Updated</th><th>Tags</th><th>Actions</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          ${paginationHTML(page, totalPages, 'goRunPage')}`;
    }

    window.goRunPage = p => { runFilter.page = p; renderFilteredRuns(); };

    async function refreshRunCacheAndRender() {
        allRunsCache = null;
        await ensureAllRunsLoaded(true);
        renderFilteredRuns();
    }

    window.newRun = function() {
        openModal(`
      <div class="modal">
        <div class="modal-head">
          <h2>🚀 Create New Run</h2>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;padding:20px 0">
          <button class="btn btn-primary btn-lg"
                  onclick="createManualRun()"
                  style="justify-content:flex-start;gap:12px">
            <span style="font-size:24px">✏️</span>
            <div style="text-align:left">
              <div style="font-weight:600">Manual Run Creation</div>
              <div style="font-size:12px;opacity:0.7">Create test scenarios manually using the visual editor</div>
            </div>
          </button>
          <button class="btn btn-secondary btn-lg"
                  onclick="createDLRun()"
                  style="justify-content:flex-start;gap:12px">
            <span style="font-size:24px">📝</span>
            <div style="text-align:left">
              <div style="font-weight:600">DL Run Creation</div>
              <div style="font-size:12px;opacity:0.7">Create tests using Defined Language syntax</div>
            </div>
          </button>
          <button class="btn btn-secondary btn-lg"
                  onclick="launchSmartRecorder()"
                  style="justify-content:flex-start;gap:12px">
            <span style="font-size:24px">🎯</span>
            <div style="text-align:left">
              <div style="font-weight:600">Smart Run Recorder</div>
              <div style="font-size:12px;opacity:0.7">Record tests using the Chrome extension</div>
            </div>
          </button>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        </div>
      </div>`);
    };

    window.createManualRun = function() {
        closeModal();
        window.location.href = `/run-editor.html?projectId=${projectId}&moduleId=${moduleId}`;
    };

    window.createDLRun = function() {
        closeModal();
        window.location.href = `/run-editor.html?projectId=${projectId}&moduleId=${moduleId}&mode=dl`;
    };

    window.launchSmartRecorder = async function () {
        closeModal();
        const response = await fetch(`/api/projects/url/${projectId}`);
        if (!response.ok) throw new Error(`Failed to fetch project details: ${response.status}`);
        const projectData = await response.json();

        let extensionId;
        try {
            const res = await api.users.getExtensionId(user.username);
            extensionId = res.extensionId;
        } catch (e) { console.error('Failed to fetch extension ID', e); }

        if (!extensionId) {
            toast('Please configure your Chrome Extension ID from the Projects page.', 'warning', 5000);
            return;
        }
        if (!window.chrome || !window.chrome.runtime) {
            toast('Chrome extension is not installed or not accessible.', 'error', 5000);
            return;
        }

        chrome.runtime.sendMessage(
            extensionId,
            {
                action: "START_RECORDING",
                projectId,
                moduleId,
                createdBy: user.username,
                url: projectData.loginUrl,
                csvPath: projectData.loginCredS3Path
            },
            (res) => {
                if (chrome.runtime.lastError) {
                    console.error("Extension message failed:", chrome.runtime.lastError.message);
                    return;
                }
                setTimeout(() => {
                    toast('window is already open close it to open new one', 'error', 10000);
                }, 1000);
            }
        );
    };

    window.viewRun = id => window.location.href = `/run-detail.html?runId=${id}`;

    window.editRun = function (id) {
        openModal(`
      <div class="modal">
        <div class="modal-head">
          <h2>Edit Run</h2>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;padding:20px 0">
          <button class="btn btn-primary" onclick="editManual('${id}')">✏️ Manual Mode</button>
          <button class="btn btn-secondary" onclick="editDL('${id}')">📝 DL Mode</button>
          <button class="btn btn-secondary" onclick="editSmart('${id}')">🎯 Smart Recorder</button>
        </div>
      </div>
    `);
    };

    window.editManual = function(id) {
        closeModal();
        window.location.href = `/run-editor.html?projectId=${projectId}&moduleId=${moduleId}&runId=${id}`;
    };

    window.editDL = function(id) {
        closeModal();
        window.location.href = `/run-editor.html?projectId=${projectId}&moduleId=${moduleId}&runId=${id}&editMode=dl`;
    };

    window.editSmart = async function(id) {
        closeModal();
        try {
            const [projectData, runData] = await Promise.all([
                fetch(`/api/projects/url/${projectId}`).then(r => { if (!r.ok) throw new Error('Failed'); return r.json(); }),
                api.runs.get(id)
            ]);

            let extensionId;
            try {
                const res = await api.users.getExtensionId(user.username);
                extensionId = res.extensionId;
            } catch (e) { console.error('Failed to fetch extension ID', e); }

            if (!extensionId) { toast('Please configure your Chrome Extension ID.', 'warning', 5000); return; }
            if (!window.chrome || !window.chrome.runtime) { toast('Chrome extension not installed.', 'error', 5000); return; }

            chrome.runtime.sendMessage(
                extensionId,
                {
                    action: "START_RECORDING",
                    projectId, moduleId, runId: id,
                    createdBy: user.username,
                    url: projectData.loginUrl,
                    csvPath: projectData.loginCredS3Path,
                    existingRun: runData
                },
                (res) => {
                    if (chrome.runtime.lastError) { toast('Failed to connect to extension', 'error'); return; }
                    setTimeout(() => { toast('window is already open close it to open new one', 'error', 10000); }, 1000);
                }
            );
        } catch (e) { toast('Smart recorder failed: ' + e.message, 'error'); }
    };

    window.cloneRun = async function (id) {
        try {
            const c = await api.runs.clone(id);
            toast(`Cloned as "${c.runName}"`, 'success');
            await refreshRunCacheAndRender();
        } catch (e) { toast('Clone failed: ' + e.message, 'error'); }
    };

    window.runNow = async function (id) {
        try {
            toast('Starting run…', 'info', 2000);
            await api.runs.execute(id);
            toast('Run Executed!', 'success');
            await refreshRunCacheAndRender();
        } catch (e) { toast('Execute failed: ' + e.message, 'error'); }
    };

    window.deleteRun = function (id) {
        openModal(`
            <div class="modal">
                <div class="modal-head">
                    <h2>🗑️ Delete Run</h2>
                    <button class="modal-close" onclick="closeModal()">✕</button>
                </div>
                <div style="padding: 20px 0;">
                    <p style="margin: 0; font-size: 14px; color: var(--tx2);">Are you sure you want to delete this test run? This cannot be undone.</p>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
                    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-danger" onclick="confirmDeleteRun('${id}')">Delete</button>
                </div>
            </div>
        `);
    };

    window.confirmDeleteRun = async function (id) {
        closeModal();
        try {
            await api.runs.delete(id);
            toast('Deleted', 'info');
            await refreshRunCacheAndRender();
        } catch (e) { toast('Delete failed: ' + e.message, 'error'); }
    };

    // ── Boot ──────────────────────────────────────────────────────────────────
    boot();
</script>
</body>
</html>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="toasts"></div>
<div id="modal-root"></div>

<!-- Full-height editor layout (no sidebar — full focus) -->
<div style="display:flex;flex-direction:column;height:100vh;overflow:hidden">

    <!-- Topbar -->
    <div class="topbar">
        <button class="btn btn-ghost btn-sm" id="back-btn">← Back</button>
        <div class="crumb">
            <a class="crumb-link" href="/projects.html">Projects</a>
            <span class="crumb-sep">›</span>
            <span class="crumb-link" id="crumb-proj">…</span>
            <span class="crumb-sep">›</span>
            <span class="crumb-link" id="crumb-mod">…</span>
            <span class="crumb-sep">›</span>
            <span class="crumb-cur" id="crumb-cur">New Run</span>
        </div>
        <div class="mla" style="display:flex;gap:8px;align-items:center">
            <button id="save-draft-btn" class="btn btn-ghost btn-sm">💾 Save Draft</button>
            <button id="save-run-btn"   class="btn btn-success">▶ Save &amp; Run</button>
            <button class="btn-icon theme-btn" onclick="toggleTheme()">☀</button>
        </div>
    </div>

    <!-- Editor body -->
    <div class="editor-layout">

        <!-- Left: scenario list sidebar -->
        <div class="editor-sidebar">
            <div class="editor-sb-head">
                <h3>Scenarios</h3>
                <span class="badge badge-blue" id="sc-count">0</span>
            </div>
            <div class="scenario-items" id="sc-items">
                <!-- populated by JS -->
            </div>
            <div class="editor-sb-foot">
                <button class="add-sc-btn" onclick="showAddMenu()">+ Add Scenario</button>
            </div>
        </div>

        <!-- Right: run meta + scenario form -->
        <div class="editor-main" id="editor-main">

            <!-- Run meta (always visible at top) -->
            <div class="card" style="margin-bottom:18px">
                <div class="card-header">
                    <span class="card-title">Run Details</span>
                </div>
                <div class="card-body">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                        <div class="field" style="margin:0">
                            <label class="lbl">Run Name *</label>
                            <input id="f-runName" class="inp" placeholder="e.g. Login smoke test">
                        </div>
                        <div class="field" style="margin:0">
                            <label class="lbl">Run Type</label>
                            <input id="f-runType" class="inp" placeholder="smoke / regression / e2e">
                        </div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
                        <div class="field" style="margin:0">
                            <label class="lbl">Tags <small style="font-weight:400;text-transform:none">(comma-separated)</small></label>
                            <input id="f-tags" class="inp" placeholder="smoke, auth, critical">
                        </div>
                        <div class="field" style="margin:0">
                            <label class="lbl">Assert Statement</label>
                            <input id="f-resultStatement" class="inp" placeholder="e.g. Login successful">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Scenario config panel -->
            <div id="sc-panel">
                <div class="empty">
                    <div class="ei">🔬</div>
                    <h3>No scenarios yet</h3>
                    <p>Click "+ Add Scenario" in the left panel to get started.</p>
                </div>
            </div>

        </div>
    </div>
</div>

    function initMonacoEditor() {

        return new Promise((resolve) => {

            require.config({ paths: { vs: 'https://unpkg.com/monaco-editor@0.45.0/min/vs' } });

            require(['vs/editor/editor.main'], function () {

                monaco.languages.register({ id: 'dl' });

                // =========================
                // 🔹 TOKENIZER
                // =========================
                monaco.languages.setMonarchTokensProvider('dl', {
                    tokenizer: {
                        root: [
                            [/^\s*@\w+/, 'keyword'],
                            [/^\s*\^\w+/, 'attribute.name'],
                            [/:/, 'delimiter'],
                            [/https?:\/\/[^\s]+/, 'string']
                        ]
                    }
                });

                // =========================
                // 🔹 AUTOCOMPLETE
                // =========================
                monaco.languages.registerCompletionItemProvider('dl', {
                    triggerCharacters: ['@', '^', '!', ':'],

                    provideCompletionItems: function (model, position) {

                        const textUntilPosition = model.getValueInRange({
                            startLineNumber: 1,
                            startColumn: 1,
                            endLineNumber: position.lineNumber,
                            endColumn: position.column
                        });

                        const lines = textUntilPosition.split('\n');
                        const currentLine = lines[lines.length - 1].trim();

                        // =========================
                        // 🔥 CONTEXT DETECTION
                        // =========================
                        let currentType = null;
                        let insideFilterBlock = false;
                        let lastFilterType = null;

                        for (let i = lines.length - 1; i >= 0; i--) {
                            const line = lines[i].trim();

                            if (line.startsWith('@') && !currentType) {
                                currentType = line.substring(1).trim();
                            }

                            if (line.startsWith('!FILTER')) {
                                insideFilterBlock = true;
                                continue;
                            }

                            if (line.startsWith('@') && insideFilterBlock) {
                                break;
                            }

                            if (line.startsWith('^filterType:')) {
                                const val = line.split(':')[1];
                                if (val) lastFilterType = val.trim();
                            }
                        }

                        // =========================
                        // 🔹 @ STEP
                        // =========================
                        if (currentLine.startsWith('@')) {
                            return {
                                suggestions: Object.keys(TYPES).map(type => ({
                                    label: type,
                                    kind: monaco.languages.CompletionItemKind.Keyword,
                                    insertText: type,
                                    detail: TYPES[type].hint || '',
                                }))
                            };
                        }

                        // =========================
                        // 🔹 ! BLOCK
                        // =========================
                        if (currentLine.startsWith('!')) {
                            if (currentType === 'FILTER_NAV') {
                                return {
                                    suggestions: [{
                                        label: 'FILTER',
                                        kind: monaco.languages.CompletionItemKind.Struct,
                                        insertText: 'FILTER',
                                        detail: 'Start filter block'
                                    }]
                                };
                            }
                        }

                        // =========================
                        // 🔹 VALUE SUGGESTIONS FIRST (🔥 KEY FIX)
                        // =========================
                        if (currentLine.startsWith('^')) {

                            const parts = currentLine.split(':');
                            const key = (parts[0] || '').replace('^', '').trim();

                            // 🔥 filterType values
                            if (key === 'filterType') {
                                console.log("🔥 filterType suggestion triggered");
                                return {
                                    suggestions: Object.keys(FILTER_OPERATIONS).map(type => ({
                                        label: type,
                                        kind: monaco.languages.CompletionItemKind.Enum,
                                        insertText: type
                                    }))
                                };
                            }

                            // 🔥 operation values
                            if (key === 'operation') {
                                console.log("🔥 operation suggestion triggered", lastFilterType);

                                if (lastFilterType && FILTER_OPERATIONS[lastFilterType]) {
                                    return {
                                        suggestions: FILTER_OPERATIONS[lastFilterType].map(op => ({
                                            label: op.value,
                                            kind: monaco.languages.CompletionItemKind.Enum,
                                            insertText: op.value,
                                            detail: op.label
                                        }))
                                    };
                                }
                            }
                        }

                        // =========================
                        // 🔹 FIELD SUGGESTIONS
                        // =========================
                        if (currentLine.startsWith('^')) {

                            const isValueContext = currentLine.includes(':');

                            if (!isValueContext) {

                                // ===== ASSERT =====
                                if (currentType === 'ASSERT') {

                                    const typedKey = currentLine.replace('^', '').trim();

                                    let lastAssertType = null;

                                    for (let i = lines.length - 1; i >= 0; i--) {
                                        const line = lines[i].trim();
                                        if (line.startsWith('^type:')) {
                                            lastAssertType = line.split(':')[1]?.trim();
                                            break;
                                        }
                                    }

                                    if (typedKey === 'type') {
                                        return {
                                            suggestions: Object.keys(ASSERT_TYPES).map(type => ({
                                                label: type,
                                                kind: monaco.languages.CompletionItemKind.Enum,
                                                insertText: type,
                                                detail: ASSERT_TYPES[type].label
                                            }))
                                        };
                                    }

                                    if (lastAssertType && ASSERT_TYPES[lastAssertType]) {
                                        return {
                                            suggestions: ASSERT_TYPES[lastAssertType].fields.map(f => ({
                                                label: f,
                                                kind: monaco.languages.CompletionItemKind.Field,
                                                insertText: `${f}:`
                                            }))
                                        };
                                    }

                                    return {
                                        suggestions: TYPES['ASSERT'].fields.map(f => ({
                                            label: f,
                                            kind: monaco.languages.CompletionItemKind.Field,
                                            insertText: `${f}:`
                                        }))
                                    };
                                }

                                // ===== FILTER_NAV =====
                                if (currentType === 'FILTER_NAV' && !insideFilterBlock) {
                                    return {
                                        suggestions: [{
                                            label: 'applyBtnCss',
                                            kind: monaco.languages.CompletionItemKind.Field,
                                            insertText: 'applyBtnCss:',
                                        }]
                                    };
                                }

                                // ===== FILTER BLOCK =====
                                if (insideFilterBlock) {
                                    return {
                                        suggestions: [
                                            'querySelector',
                                            'filterType',
                                            'operation',
                                            'value',
                                            'valueSelector',
                                            'logicalOperator'
                                        ].map(f => ({
                                            label: f,
                                            kind: monaco.languages.CompletionItemKind.Field,
                                            insertText: `${f}:`
                                        }))
                                    };
                                }

                                // ===== NORMAL =====
                                if (currentType && TYPES[currentType]) {
                                    return {
                                        suggestions: TYPES[currentType].fields.map(f => ({
                                            label: f,
                                            kind: monaco.languages.CompletionItemKind.Field,
                                            insertText: `${f}:`,
                                        }))
                                    };
                                }
                            }
                        }

                        return { suggestions: [] };
                    }
                });

                // =========================
                // 🔹 HOVER
                // =========================
                monaco.languages.registerHoverProvider('dl', {
                    provideHover: function (model, position) {

                        const line = model.getLineContent(position.lineNumber);

                        const wordInfo = model.getWordAtPosition(position);
                        if (!wordInfo) return;

                        const word = wordInfo.word;

                        // Detect prefix
                        const start = wordInfo.startColumn - 1;
                        const charBefore = line[start - 1];

                        let fullWord = word;

                        if (charBefore === '@') {
                            fullWord = '@' + word;
                        }

                        // =========================
                        // 🔥 AUTO-GENERATE DOCS
                        // =========================
                        const docs = {};

                        // =========================
                        // 🔹 SCENARIOS (TYPES)
                        // =========================
                        Object.entries(TYPES).forEach(([key, val]) => {
                            docs['@' + key] = {
                                title: `${val.icon || ''} ${val.label}`,
                                desc: val.hint,
                                fields: val.fields?.map(f => `^${f}`) || []
                            };
                        });

                        // =========================
                        // 🔹 ASSERT TYPES
                        // =========================
                        Object.entries(ASSERT_TYPES).forEach(([key, val]) => {
                            docs[key] = {
                                title: val.label,
                                desc: `Required: ${val.required.join(', ')}`,
                                fields: val.fields.map(f => `^${f}`)
                            };
                        });

                        // =========================
                        // 🔹 FILTER TYPES
                        // =========================
                        FILTER_TYPES.forEach(f => {
                            docs[f.value] = {

                                desc: desc
                            };
                        });

                        // =========================
                        // 🔍 RESOLVE DOC
                        // =========================
                        const doc = docs[fullWord] || docs[word];

                        if (!doc) return;

                        return {
                            contents: [
                                { value: `### ${doc.title}` },
                                { value: doc.desc || '' },
                                ...(doc.fields
                                    ? [{ value: `\n**Fields:**\n- ${doc.fields.join('\n- ')}` }]

                        };

        const scenario = scenarios[scIdx];

        if (scenario.assertions && scenario.assertions[assertionIdx]) {
            scenario.assertions[assertionIdx].type = type;

            // 🔥 smart cleanup (important)
            const newConfig = ASSERT_TYPES[type] || { fields: [] };

            const allFields = ['locator', 'expected', 'tableId', 'columnName', 'order', 'rowsBtn','promptAi'];

            allFields.forEach(field => {
                // console.log("field : "+field+", newConfig.fields.includes(field):  "+newConfig.fields.includes(field))
                if (!newConfig.fields.includes(field)) {
                    scenario.assertions[assertionIdx][field] = '';

            });

            console.log("newConfig "+newConfig);

            renderPanel();
        }
    };

    function formatDateTime(val) {
        if (!val) return '';

        const [date, time] = val.split('T');
        if (!date || !time) return val;

        const [y, m, d] = date.split('-');

        return `${d}-${m}-${y} ${time}`;
    }

    function formatDate(val) {
        if (!val) return '';
        const [y, m, d] = val.split('-');
        console.log("y : "+y+" ,m : "+m+" ,d : "+d);
        return `${d}-${m}-${y}`;
    }

            return `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                    <input class="inp" type="datetime-local" lang="en-GB" value="${f.value?.start || ''}"
                onchange="updateFilterRange(${scIdx}, ${fi}, 'start', this.value)">

            <input class="inp" type="datetime-local" lang="en-GB"
                value="${f.value?.end || ''}"
                onchange="updateFilterRange(${scIdx}, ${fi}, 'end', this.value)">
        </div>`;
        }

        // ✅ DATE RANGE (two calendars)
        if (f.operation === 'RANGE') {
            console.log("inside renderFilterValue and dateRange and Date selected");

            return `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <input class="inp" type="date"
                value="${f.value?.start || ''}"
                onchange="updateFilterRange(${scIdx}, ${fi}, 'start', this.value)">

            <input class="inp" type="date"
                value="${f.value?.end || ''}"
                onchange="updateFilterRange(${scIdx}, ${fi}, 'end', this.value)">
        </div>`;
        }

        // ✅ SINGLE DATE (calendar)
        if (f.filterType === 'DATE') {
            return `
                <div class="field">
                    <label class="lbl">Date *</label>
                    <input class="inp" type="date"
                        value="${f.value || ''}"
                        onchange="updateFilter(${scIdx}, ${fi}, 'value', this.value)">
                    <small style="color:var(--tx2)">
                        ${formatDate(f.value)}
                    </small>
                </div>`;
        }
        if (f.filterType === 'DATE_TIME') {
            return `
    <div class="field">
        <label class="lbl">Date & Time *</label>
        <input class="inp" type="datetime-local"
            value="${f.value || ''}"
            onchange="updateFilter(${scIdx}, ${fi}, 'value', this.value)">
        <small style="color:var(--tx2)">
            ${formatDateTime(f.value)}
        </small>
    </div>`;
        }

        // ✅ NUMBER
        if (f.filterType === 'NUMBER') {
            return `
        <div class="field">
            <label class="lbl">Value *</label>
            <input class="inp" type="number"
                value="${f.value || ''}"
                oninput="updateFilter(${scIdx}, ${fi}, 'value', this.value)">
        </div>`;
        }

        // ✅ TEXT (default)
        return `
    <div class="field">
        <label class="lbl">Value *</label>
        <input class="inp"
            value="${f.value || ''}"
            oninput="updateFilter(${scIdx}, ${fi}, 'value', this.value)">
    </div>`;
    }

    window.addFilter = function (scIdx) {
        console.log("Inside add filter");

        if (!scenarios[scIdx]) {
            console.error("Invalid scenario index:", scIdx);
            return;
        }

        if (!Array.isArray(scenarios[scIdx].filters)) {
            scenarios[scIdx].filters = [];
        }
        scenarios[scIdx].filters.push({
            querySelectorOfColName: '',
            filterType: '',
            operation: '',
            value: '',
            searchCssSelector: '',
            logicalOperatorSelector:'',
        });
        renderPanel();
    };

    window.removeFilter = function (scIdx, fi) {
        scenarios[scIdx].filters.splice(fi, 1);
        renderPanel();
    };

    // window.updateFilter = function (scIdx, fi, field, value) {
    //     scenarios[scIdx].filters[fi][field] = value;
    //
    //     renderPanel();
    // };
    window.updateFilter = function (scIdx, fi, field, value) {
        if (field === 'operation' && typeof value === 'string') {
            value = value.toUpperCase();
        }
        scenarios[scIdx].filters[fi][field] = value;
    };

    window.updateFilterType = function (scIdx, fi, type) {
        const f = scenarios[scIdx].filters[fi];
        f.filterType = type;
        f.operation = '';
        f.value = '';
        f.searchCssSelector='';
        f.logicalOperatorSelector='';
        renderPanel(); // important
    };

    window.updateFilterRange = function (scIdx, fi, key, val) {
        const f = scenarios[scIdx].filters[fi];
        if (!f.value) f.value = {};
        f.value[key] = val;
    };

    // ── Test data section (CSV upload or manual entry) ─────────────────────
    function renderDataSection(idx, s, tab) {
        const tcs = s.manualTestCases || [];
        return `
    <div class="sc-section">Test Data</div>
    <div class="dtabs">
      <div class="dtab ${tab !== 'csv' ? 'active' : ''}" onclick="setTab(${idx}, 'manual')">
        📝 Manual Entry
      </div>
      <div class="dtab ${tab === 'csv' ? 'active' : ''}" onclick="setTab(${idx}, 'csv')">
        📁 Upload CSV
      </div>
    </div>
    <div class="dtab-body">
      ${tab === 'csv' ? renderCsvTab(idx, s) : renderManualTab(idx, tcs)}
    </div>`;
    }

    function renderCsvTab(idx, s) {
        return `
    <div class="drop-zone"
      ondragover="event.preventDefault();this.classList.add('drag')"
      ondragleave="this.classList.remove('drag')"
      ondrop="onDrop(event, ${idx})">
      <input type="file" accept=".csv,.xlsx,.xls"
        onchange="onFileSelect(${idx}, this.files[0])">
      <div style="font-size:26px;margin-bottom:8px">📂</div>
      <p>Drop a CSV or XLSX file here, or click to browse</p>
      <small>First row = column headers · each row below = one test case</small>
    </div>
    ${s.csv ? `
    <div style="padding:10px 14px;background:var(--gr-d);
      border-top:1px solid var(--bd);display:flex;align-items:center;gap:8px">
      <span style="font-size:12px;font-family:var(--mono);color:var(--gr);
        flex:1;overflow:hidden;text-overflow:ellipsis">✓ ${esc(s.csv)}</span>
      <button class="btn btn-danger btn-xs" onclick="clearCsv(${idx})">Remove</button>
    </div>` : ''}`;
    }

    function renderManualTab(idx, tcs) {
        return `
    <div class="tc-manual">
      <table>
        <thead>
          <tr>
            <th style="width:36px">#</th>
            <th>Name / ID</th>
            <th>Expected Result</th>
            <th style="width:36px"></th>
          </tr>
        </thead>
        <tbody id="tc-body-${idx}">
          ${tcs.map((tc, ti) => tcRow(idx, ti, tc)).join('')}
        </tbody>
      </table>
      <div class="tc-bar">
        <span style="font-size:11px;color:var(--tx2)">
          ${tcs.length} test case${tcs.length !== 1 ? 's' : ''}
        </span>
        <button class="btn btn-ghost btn-xs" onclick="addRow(${idx})">+ Add Row</button>
      </div>
    </div>`;
    }

    function tcRow(idx, ti, tc) {
        return `
    <tr>
      <td style="font-family:var(--mono);font-size:11px;color:var(--tx2)">${ti + 1}</td>
      <td>
        <input value="${esc(tc.name || tc.testcaseId || '')}"
          placeholder="tc_${ti + 1}"
          oninput="updateRow(${idx}, ${ti}, 'name', this.value)">
      </td>
      <td>
        <input value="${esc(tc.expectedResult || '')}"
          placeholder="Expected outcome"
          oninput="updateRow(${idx}, ${ti}, 'expectedResult', this.value)">
      </td>
      <td>
        <button style="background:none;border:none;cursor:pointer;color:var(--tx3);
          font-size:13px;padding:3px 6px"
          onclick="removeRow(${idx}, ${ti})"
          onmouseover="this.style.color='var(--rd)'"
          onmouseout="this.style.color='var(--tx3)'">✕</button>
      </td>
    </tr>`;
    }

    // Initialize FORM_MODAL support after renderPanel is defined
    // updateFormModalPayload();

    // Handle click option radio button changes for FORM_MODAL
    window.handleClickOption = function (scIdx, option) {
        const scenario = scenarios[scIdx];

        scenario.clickEnabled = (option === 'yes');

        if (!scenario.clickEnabled) {
            scenario.clickCss = '';
        }

        renderPanel();
    };

    // ── Scenario actions ───────────────────────────────────────────────────
    window.selectScenario = function (i) {
        scIdx = i;
        renderSidebar();
        renderPanel();
    };

    window.setType = function (i, type) {
        scenarios[i].type = type;
        renderSidebar();
        renderPanel();
    };

    window.removeScenario = function (i) {
        if (scenarios.length === 1 && !confirm('Remove the only scenario?')) return;
        scenarios.splice(i, 1);
        if (scIdx >= scenarios.length) scIdx = Math.max(0, scenarios.length - 1);
        renderSidebar();
        renderPanel();
    };

    window.moveScenario = function (i, dir) {
        const j = i + dir;
        if (j < 0 || j >= scenarios.length) return;
        [scenarios[i], scenarios[j]] = [scenarios[j], scenarios[i]];
        scIdx = j;
        renderSidebar();
        renderPanel();
    };

    window.updateField = function (i, field, val) {
        if (scenarios[i]) {
            scenarios[i][field] = val;
            // Refresh sidebar label without re-rendering the panel (avoids losing focus)
            const si = document.querySelector(`#sc-items .si:nth-child(${i + 1}) .si-label`);
            if (si) {
                const s = scenarios[i];
                si.textContent = s.url || s.cssSelector || s.value || 'New scenario';
            }
        }
    };

    // ── Test data tab ──────────────────────────────────────────────────────
    window.setTab = function (idx, tab) {
        scTab[scenarios[idx]._key] = tab;
        renderPanel();
    };

    // ── CSV upload ─────────────────────────────────────────────────────────
    window.onDrop = function (e, idx) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag');
        const file = e.dataTransfer.files[0];
        if (file) onFileSelect(idx, file);
    };

    window.onFileSelect = async function (idx, file) {
        if (!file) return;
        try {
            toast('Uploading…', 'info', 1500);
            const pid = projectId || '';
            const mid = moduleId  || '';
            const rid = runId     || '';
            const res = await api.uploads.csv(file, pid, mid, idx + 1, rid);
            scenarios[idx].csv = res.path || res.key || file.name;
            renderPanel();
            toast('CSV uploaded', 'success');
        } catch (e) {
            toast('Upload failed: ' + e.message, 'error');
        }
    };

    window.clearCsv = function (idx) {
        scenarios[idx].csv = '';
        renderPanel();
    };

    // ── Manual rows ────────────────────────────────────────────────────────
    window.addRow = function (idx) {
        scenarios[idx].manualTestCases.push({ testcaseId: `tc_${Date.now()}`, name: '', expectedResult: '' });
        renderPanel();
    };

    window.removeRow = function (idx, ti) {
        scenarios[idx].manualTestCases.splice(ti, 1);
        renderPanel();
    };

    window.updateRow = function (idx, ti, field, val) {
        if (scenarios[idx]?.manualTestCases[ti]) {
            scenarios[idx].manualTestCases[ti][field] = val;
        }
    };

    // ── Add scenario menu ──────────────────────────────────────────────────
    window.showAddMenu = function () {
        const btns = Object.entries(TYPES).map(([k, v]) => `
      <button onclick="addScenario('${k}')"
        style="display:flex;align-items:center;gap:10px;padding:13px;
          background:var(--inp);border:1.5px solid var(--bd);
          border-radius:var(--r);cursor:pointer;text-align:left;
          font-family:var(--sans);transition:all .13s;width:100%"
        onmouseover="this.style.borderColor='${v.color}';this.style.background='${v.bg}'"
        onmouseout="this.style.borderColor='var(--bd)';this.style.background='var(--inp)'">
        <span style="font-size:20px">${v.icon}</span>
        <div>
          <div style="font-size:12.5px;font-weight:700;color:var(--tx)">${v.label}</div>
          <div style="font-size:11px;color:var(--tx2);margin-top:1px">${esc(v.hint)}</div>
        </div>
      </button>`).join('');

        openModal(`
      <div class="modal">
        <div class="modal-head">
          <h2>Add Scenario</h2>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">${btns}</div>
      </div>`);
    };

    window.addScenario = function (type) {
        const newScenario = {
            _key:            ++scKey,
            id:              undefined,
            type,
            url:             '',
            cssSelector:     '',
            value:           '',
            clickEnabled:    false,
            clickCss:        '', // Add clickCss field
            csv:             '',
            manualTestCases: [],
        };

        // 🔥 ONLY ADD THIS (no breaking change)
        if (type === 'ASSERT') {
            newScenario.assertions = [];
        }
        if (type === 'FILTER_NAV') {
            newScenario.filters = [];
            newScenario.applyBtnCss = '';
        }
        if (type === 'DATE_RANGE_NAV') {

            newScenario.inputSelector = '';
            newScenario.selectionType = 'PRESET';
            // preset mode
            newScenario.preset = 'LAST_MONTH';
            // custom mode
            newScenario.startDate = '';
            newScenario.endDate = '';
            newScenario.applyButtonSelector = '';
            newScenario.calendarContainerSelector = '';
            newScenario.dateFormat = '';
        }

        console.log(type+"choosen!")

        scenarios.push(newScenario);
        scIdx = scenarios.length - 1;
        closeModal();
        renderSidebar();
        renderPanel();
    };

    // ── Validation ─────────────────────────────────────────────────────────
    function validate() {
        const name = document.getElementById('f-runName').value.trim();
        if (!name) { toast('Run name is required', 'warning'); return false; }

        if (mode === 'dl' || editMode === 'dl') {
            const script = window.editor?.getValue();

            if (!script || !script.trim()) {
                toast('DL script cannot be empty', 'warning');
                return false;
            }

            return true;
        }

        if (!scenarios.length) {
            toast('Add at least one scenario', 'warning');
            return false;
        }

        for (let i = 0; i < scenarios.length; i++) {
            const s = scenarios[i];

            const req = REQUIRED[s.type] || [];

            // ✅ existing validation
            for (const f of req) {
                const val = f === 'cssSelector' ? s.cssSelector : s[f];

                if (!val || (typeof val === 'string' && !val.trim())) {
                    toast(`Scenario #${i + 1} (${s.type}): "${f}" is required`, 'warning');
                    selectScenario(i);
                    return false;
                }
            }

            // ✅ 🔥 FILTER_NAV validation
            if (s.type === 'FILTER_NAV') {

                if (!s.filters || s.filters.length === 0) {
                    toast(`Scenario #${i + 1}: Add at least one filter`, 'warning');
                    selectScenario(i);
                    return false;
                }

                for (let j = 0; j < s.filters.length; j++) {
                    const f = s.filters[j];

                    if (!f.querySelectorOfColName?.trim()) {
                        toast(`Scenario #${i + 1} → Filter #${j + 1}: Column selector required`, 'warning');
                        selectScenario(i);
                        return false;
                    }

                    if (!f.filterType) {
                        toast(`Scenario #${i + 1} → Filter #${j + 1}: Select filter type`, 'warning');
                        selectScenario(i);
                        return false;
                    }

                    if (!f.operation) {
                        toast(`Scenario #${i + 1} → Filter #${j + 1}: Select operation`, 'warning');
                        selectScenario(i);
                        return false;
                    }

                    // ✅ handle date range specially
                    if (f.operation === 'RANGE') {
                        if (!f.value?.start || !f.value?.end) {
                            toast(`Scenario #${i + 1} → Filter #${j + 1}: Date range required`, 'warning');
                            selectScenario(i);
                            return false;
                        }
                    } else {
                        if (!f.value || (typeof f.value === 'string' && !f.value.trim())) {
                            toast(`Scenario #${i + 1} → Filter #${j + 1}: Value required`, 'warning');
                            selectScenario(i);
                            return false;
                        }
                    }
                }

                // apply button validation (extra safety)
                if (!s.applyBtnCss?.trim()) {
                    toast(`Scenario #${i + 1}: Apply button selector required`, 'warning');
                    selectScenario(i);
                    return false;
                }
            }
            else if (s.type === 'DATE_RANGE_NAV'){
                if (!validateDateRangeNavScenario(s, i)) return false;
            }

        }

        return true;
    }

    function validateDateRangeNavScenario(s, index) {

        // always required
        const requiredFields = [
            'inputSelector',
            'calendarContainerSelector',
            'applyButtonSelector',
            'selectionType'
        ];

        for (const field of requiredFields) {

            const val = s[field];

            if (!val || (typeof val === 'string' && !val.trim())) {

                toast(
                    `Scenario #${index + 1}: "${field}" is required`,
                    'warning'
                );

                selectScenario(index);
                return false;
            }
        }

        // PRESET validation
        if (s.selectionType === 'PRESET') {

            if (!s.preset || !s.preset.trim()) {

                toast(
                    `Scenario #${index + 1}: Preset is required`,
                    'warning'
                );

                selectScenario(index);
                return false;
            }
        }

        // CUSTOM validation
        if (s.selectionType === 'CUSTOM') {

            if (!s.startDate?.trim()) {

                toast(
                    `Scenario #${index + 1}: Start Date is required`,
                    'warning'
                );

                selectScenario(index);
                return false;
            }

            if (!s.endDate?.trim()) {

                toast(
                    `Scenario #${index + 1}: End Date is required`,
                    'warning'
                );

                selectScenario(index);
                return false;
            }

            if (!s.dateFormat?.trim()) {

                toast(
                    `Scenario #${index + 1}: Date Format is required`,
                    'warning'
                );

                selectScenario(index);
                return false;
            }
        }

        return true;
    }

    function formatRange(start, end, type) {
        if (type === 'DATE') return `${formatDate(start)} to ${formatDate(end)}`;
        if (type === 'DATE_TIME') return `${formatDateTime(start)} to ${formatDateTime(end)}`;
        return `${start} to ${end}`;
    }


    // ── Save to DB ─────────────────────────────────────────────────────────
    async function saveRun() {
        // 🔥 ADD HERE
        console.log("SCENARIOS BEFORE SAVE:", JSON.stringify(scenarios, null, 2));
        const data = buildPayload(mode, toast, user, scenarios,projectData);
        // optional (very useful)
        console.log("PAYLOAD:", JSON.stringify(data, null, 2));
        if (runId) {
            return api.runs.update(runId, data);
        }
        return api.runs.create(projectId, moduleId, data);
    }

    // ── Save Draft button ──────────────────────────────────────────────────
    document.getElementById('save-draft-btn').onclick = async function () {
        if (!validate()) return;
        this.disabled = true;
        this.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-width:2px;display:inline-block"></div> Saving…';
        try {
            await saveRun();
            toast('Saved as draft', 'success');
        } catch (e) { toast('Save failed: ' + e.message, 'error'); }
        finally { this.disabled = false; this.innerHTML = '💾 Save Draft'; }
    };

    // ── Save & Run button ──────────────────────────────────────────────────
    document.getElementById('save-run-btn').onclick = async function () {
        if (!validate()) return;
        this.disabled = true;
        this.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-width:2px;display:inline-block"></div> Saving…';
        try {
            const saved   = await saveRun();
            const savedId = saved.id || saved._id;
            toast('Saved — starting run…', 'info', 2000);
            this.innerHTML = '⏳ Running…';
            await api.runs.execute(savedId);
            toast('Run started!', 'success');
            window.location.href = `/run-detail.html?runId=${savedId}`;
        } catch (e) {
            // Extract user-friendly message from error response
            let errorMessage = 'Error occurred while starting run';
            if (e.response && e.response.data && e.response.data.message) {
                errorMessage = e.response.data.message;
            } else if (e.message) {
                errorMessage = e.message;
            }
            toast(errorMessage, 'error', 5000); // Show for 5 seconds
            this.disabled = false;
            this.innerHTML = '▶ Save & Run';
        }
    };
</script>
</body>
</html>

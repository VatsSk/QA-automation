<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QA Studio — Flow Execution</title>
    <meta name="description" content="View flow execution details, step-by-step results, and screenshots for QA automation flows.">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* ── Flow Detail page-specific styles ─────────────────────── */

        /* Hero summary */
        .flow-hero {
            background: var(--sur);
            border: 1px solid var(--bd);
            border-radius: var(--r);
            padding: 22px 24px;
            margin-bottom: 20px;
        }
        .flow-hero-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .flow-hero-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.4px;
            margin-bottom: 6px;
        }
        .flow-hero-desc {
            font-size: 13px;
            /*color: var(--tx2);*/
            margin-top: 4px;
            line-height: 1.5;
        }
        .flow-stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
        }
        .flow-stat-label {
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--tx2);
            margin-bottom: 3px;
        }
        .flow-stat-val {
            font-size: 13.5px;
        }
        .flow-stat-val strong {
            font-weight: 800;
        }
        .stat-counts {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .stat-counts .badge {
            font-size: 10.5px;
            font-weight: 700;
        }

        /* Step filter bar */
        .step-filter-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background: var(--sur);
            border: 1px solid var(--bd);
            border-radius: var(--r);
            padding: 10px 14px;
            margin-bottom: 14px;
        }
        .step-count-label {
            font-size: 12px;
            color: var(--tx2);
            font-weight: 600;
            margin-left: auto;
        }

        /* Step list (single column layout) */
        .step-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 1000px;
        }

        /* Inline detail panel (expands below step card) */
        .step-inline-detail {
            display: none;
            border-top: 1px solid var(--bd);
            background: var(--sur2);
            padding: 20px;
            animation: slideDown .2s ease;
        }
        .step-card.selected .step-inline-detail {
            display: block;
        }
        @keyframes slideDown {
            from { opacity: 0; max-height: 0; }
            to   { opacity: 1; max-height: 3000px; }
        }

        /* Step card */
        .step-card {
            background: var(--sur);
            border: 1.5px solid var(--bd);
            border-radius: var(--r);
            overflow: hidden;
            transition: border-color .14s, box-shadow .14s;
            cursor: pointer;
        }
        .step-card.selected {
            border-color: var(--blue);
            box-shadow: 0 0 0 1px var(--blue);
            background: var(--sur2);
        }
        .step-card:hover {
            border-color: var(--bd2);
        }
        .step-card.selected:hover {
            border-color: var(--blue);
        }
        .step-card.step-failed {
            border-left: 3px solid var(--rd);
        }
        .step-card.step-failed.selected {
            background: linear-gradient(90deg, rgba(239,68,98,.04) 0%, transparent 40%);
            border-color: var(--rd);
            box-shadow: 0 0 0 1px var(--rd);
        }
        .step-card.step-passed {
            border-left: 3px solid var(--gr);
        }
        .step-card.step-running {
            border-left: 3px solid var(--am);
            animation: pulse 2s ease-in-out infinite;
        }

        /* Step head (collapsed view) */
        .step-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            user-select: none;
            transition: background .12s;
        }
        .step-head:hover {
            background: var(--sur2);
        }
        .step-num {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--sur2);
            border: 1.5px solid var(--bd);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            font-family: var(--mono);
            color: var(--tx2);
            flex-shrink: 0;
        }
        .step-failed .step-num {
            background: var(--rd-d);
            border-color: var(--rd-b);
            color: var(--rd);
        }
        .step-passed .step-num {
            background: var(--gr-d);
            border-color: var(--gr-b);
            color: var(--gr);
        }

        .action-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 10.5px;
            font-weight: 700;
            border: 1px solid transparent;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .step-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .step-name-text {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .step-selector-text {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--tx3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 320px;
        }
        .step-value-text {
            font-size: 11.5px;
            color: var(--tx2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }
        .step-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .step-duration {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--tx3);
        }
        .step-thumb {
            width: 56px;
            height: 36px;
            border-radius: 4px;
            border: 1px solid var(--bd);
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            transition: border-color .14s, box-shadow .14s;
            background: var(--sur2);
        }
        .step-thumb:hover {
            border-color: var(--blue-b);
            box-shadow: 0 2px 8px rgba(47,128,240,.2);
        }
        .step-failed .step-thumb {
            border-color: var(--rd-b);
            box-shadow: 0 0 12px rgba(239,68,98,.25);
        }
        .step-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .step-thumb-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--tx3);
            font-size: 14px;
        }
        .step-chevron {
            font-size: 10px;
            color: var(--tx3);
            transition: transform .15s;
            flex-shrink: 0;
        }
        .step-card.open .step-chevron {
            transform: rotate(180deg);
        }

        /* Step body (expanded view) */
        .step-body {
            border-top: 1px solid var(--bd);
            background: var(--sur2);
            padding: 18px;
            display: none;
        }
        .step-card.open .step-body {
            display: block;
        }

        .step-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .step-detail-item {
            min-width: 0;
        }
        .step-detail-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--tx3);
            margin-bottom: 4px;
        }
        .step-detail-value {
            font-size: 12.5px;
            word-break: break-all;
        }
        .step-detail-value code {
            font-family: var(--mono);
            font-size: 11.5px;
            background: var(--sur3);
            padding: 2px 6px;
            border-radius: var(--rx);
            color: var(--blue);
            word-break: break-all;
        }

        /* Failure alert */
        .step-error-alert {
            background: var(--rd-d);
            border: 1px solid var(--rd-b);
            border-radius: var(--rs);
            padding: 12px 16px;
            margin-top: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .step-error-alert .alert-icon {
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .step-error-alert .alert-text {
            font-size: 12.5px;
            color: var(--rd);
            font-weight: 500;
            line-height: 1.5;
            word-break: break-word;
        }

        /* Screenshot in expanded view */
        .step-screenshot-section {
            margin-top: 14px;
        }
        .step-screenshots-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .step-screenshot-preview {
            max-width: 360px;
            border: 1px solid var(--bd);
            border-radius: var(--rs);
            overflow: hidden;
            cursor: pointer;
            transition: all .14s;
            background: var(--sur3);
        }
        .step-screenshot-preview:hover {
            border-color: var(--blue-b);
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(47,128,240,.15);
        }
        .step-failed .step-screenshot-preview {
            max-width: 480px;
            border-color: var(--rd-b);
            box-shadow: 0 0 16px rgba(239,68,98,.2);
        }
        .step-screenshot-preview img {
            width: 100%;
            display: block;
        }
        .step-screenshot-caption {
            padding: 6px 10px;
            font-size: 10.5px;
            color: var(--tx3);
            font-family: var(--mono);
            background: var(--sur2);
        }

        /* Tooltip */
        .has-tooltip {
            position: relative;
        }
        .has-tooltip:hover .tooltip-text {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .tooltip-text {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 0;
            background: var(--sur3);
            border: 1px solid var(--bd2);
            border-radius: var(--rx);
            padding: 6px 10px;
            font-size: 11px;
            font-family: var(--mono);
            color: var(--tx);
            white-space: nowrap;
            max-width: 420px;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transform: translateY(4px);
            transition: all .14s;
            pointer-events: none;
            box-shadow: 0 4px 12px rgba(0,0,0,.3);
        }

        /* Masked value */
        .masked-value {
            font-family: var(--mono);
            letter-spacing: 1px;
            color: var(--tx3);
        }

        /* Thumbnail strip & Preview */
        .sv-main {
            position: relative;
            background: var(--sur2);
            border: 1px solid var(--bd);
            border-radius: var(--rs);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            overflow: hidden;
        }
        .sv-image-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .sv-image-container img {
            max-width: 100%;
            max-height: 600px;
            object-fit: contain;
            cursor: pointer;
            border-radius: var(--rs);
        }
        .sv-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            z-index: 10;
            transition: background .2s;
        }
        .sv-nav-btn:hover:not(:disabled) {
            background: rgba(0,0,0,0.9);
        }
        .sv-nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }
        .sv-nav-btn.prev { left: 16px; }
        .sv-nav-btn.next { right: 16px; }

        .sv-thumbnails {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .sv-thumb {
            flex: 0 0 140px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
        }
        .sv-thumb-img-wrap {
            width: 140px;
            height: 85px;
            border: 2px solid transparent;
            border-radius: var(--rx);
            overflow: hidden;
            background: var(--sur2);
            transition: border-color .2s;
        }
        .sv-thumb.selected .sv-thumb-img-wrap {
            border-color: var(--blue);
        }
        .sv-thumb:hover .sv-thumb-img-wrap {
            border-color: var(--blue-b);
        }
        .sv-thumb.selected:hover .sv-thumb-img-wrap {
            border-color: var(--blue);
        }
        .sv-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sv-thumb-label {
            font-size: 11px;
            text-align: center;
            color: var(--tx2);
            font-weight: 500;
        }
        .sv-thumb.selected .sv-thumb-label {
            color: var(--blue);
            font-weight: 700;
        }

        /* Progress bar for running flows */
        .flow-progress {
            margin-top: 14px;
        }
        .flow-progress-bar {
            height: 4px;
            background: var(--sur3);
            border-radius: 99px;
            overflow: hidden;
        }
        .flow-progress-fill {
            height: 100%;
            border-radius: 99px;
            transition: width .3s ease;
        }
        .flow-progress-label {
            font-size: 11px;
            color: var(--tx3);
            margin-top: 5px;
            text-align: right;
        }

        /* ── Step Slideshow (carousel navigation) ──────────────────── */
        .slideshow-toggle-group {
            display: inline-flex;
            background: var(--sur2);
            border: 1px solid var(--bd);
            border-radius: 999px;
            padding: 3px;
            gap: 2px;
        }
        .slideshow-toggle-group .btn {
            border-radius: 999px !important;
        }

        .autoslide-switch {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--tx2);
            cursor: pointer;
            margin-left: 8px;
            user-select: none;
        }
        .autoslide-switch input { display: none; }
        .autoslide-switch .switch-track {
            position: relative;
            width: 30px;
            height: 17px;
            border-radius: 99px;
            background: var(--sur3);
            border: 1px solid var(--bd);
            transition: background .18s, border-color .18s;
            flex-shrink: 0;
        }
        .autoslide-switch .switch-thumb {
            position: absolute;
            top: 1px;
            left: 1px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--tx3);
            transition: transform .18s, background .18s;
        }
        .autoslide-switch input:checked + .switch-track {
            background: var(--blue);
            border-color: var(--blue);
        }
        .autoslide-switch input:checked + .switch-track .switch-thumb {
            transform: translateX(13px);
            background: #fff;
        }

        .step-slideshow-wrap {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .step-slideshow-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .slideshow-nav-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--sur);
            border: 1.5px solid var(--bd);
            color: var(--tx);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: border-color .15s, background .15s, transform .1s, box-shadow .15s, opacity .15s;
            box-shadow: 0 2px 10px rgba(0,0,0,.14);
        }
        .slideshow-nav-btn svg { width: 18px; height: 18px; }
        .slideshow-nav-btn:hover:not(:disabled) {
            border-color: var(--blue);
            color: var(--blue);
            background: var(--sur2);
        }
        .slideshow-nav-btn:active:not(:disabled) { transform: scale(0.92); }
        .slideshow-nav-btn:disabled {
            opacity: .3;
            cursor: not-allowed;
        }

        .step-slideshow-stage {
            flex: 1;
            min-width: 0;
            position: relative;
            overflow: hidden;
            touch-action: pan-y;
        }
        .step-slideshow-track {
            animation: slideFadeInNext .28s ease;
        }
        .step-slideshow-track.dir-prev {
            animation-name: slideFadeInPrev;
        }
        @keyframes slideFadeInNext {
            from { opacity: 0; transform: translateX(18px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideFadeInPrev {
            from { opacity: 0; transform: translateX(-18px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .slideshow-progress-line {
            height: 3px;
            border-radius: 99px;
            background: var(--sur3);
            overflow: hidden;
        }
        .slideshow-progress-line .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--blue), var(--te));
            border-radius: 99px;
        }
        .slideshow-progress-line .fill.animating {
            animation: fillProgress linear forwards;
        }
        @keyframes fillProgress {
            from { width: 0%; }
            to   { width: 100%; }
        }

        .step-slide-counter {
            text-align: center;
            font-size: 12px;
            color: var(--tx2);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .step-slide-counter .kbd-hint {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--tx3);
            background: var(--sur3);
            border: 1px solid var(--bd);
            padding: 1px 6px;
            border-radius: var(--rx);
        }

        .step-rail {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 8px 4px 10px;
            scroll-behavior: smooth;
        }
        .step-rail::-webkit-scrollbar { height: 5px; }
        .step-rail::-webkit-scrollbar-thumb { background: var(--bd2); border-radius: 99px; }
        .step-rail-dot {
            flex-shrink: 0;
            min-width: 30px;
            height: 26px;
            padding: 0 6px;
            border-radius: 8px;
            border: 1.5px solid var(--bd);
            background: var(--sur);
            color: var(--tx2);
            font-family: var(--mono);
            font-size: 10.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .13s;
        }
        .step-rail-dot:hover { border-color: var(--bd2); transform: translateY(-1px); }
        .step-rail-dot.rail-passed { border-color: var(--gr-b); color: var(--gr); background: var(--gr-d); }
        .step-rail-dot.rail-failed { border-color: var(--rd-b); color: var(--rd); background: var(--rd-d); }
        .step-rail-dot.rail-running { border-color: var(--am-b); color: var(--am); background: var(--am-d); }
        .step-rail-dot.active {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
            box-shadow: 0 0 0 3px rgba(47,128,240,.22);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .step-slideshow-container { gap: 8px; }
            .slideshow-nav-btn { width: 34px; height: 34px; }
            .slideshow-nav-btn svg { width: 15px; height: 15px; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .step-detail-grid {
                grid-template-columns: 1fr;
            }
            .flow-stats {
                grid-template-columns: 1fr 1fr;
            }
            .step-selector-text,
            .step-value-text {
                max-width: 150px;
            }
            .step-head {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
<div id="toasts"></div>
<div id="modal-root"></div>

<div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-col">

        <div class="topbar">
            <div class="crumb">
                <a class="crumb-link" href="/projects.html">Projects</a>
                <span class="crumb-sep">›</span>
                <span class="crumb-link" id="crumb-proj" style="cursor:pointer">…</span>
                <span class="crumb-sep">›</span>
                <span class="crumb-link" id="crumb-mod" style="cursor:pointer">…</span>
                <span class="crumb-sep">›</span>
                <span class="crumb-cur" id="crumb-flow">Flow Detail</span>
            </div>
            <div class="topbar-right">
                <button class="btn-icon theme-btn" onclick="toggleTheme()">☀</button>
            </div>
        </div>

        <div class="main-scroll">
            <div class="page">
                <div id="page-content">
                    <div class="spinner-wrap"><div class="spinner"></div></div>
                </div>
            </div>
        </div>

    </div>
</div>

<script type="module">
    import * as api from './js/api.js';
    import {
        esc,
        statusBadge,
        timeAgo,
        fmtDate,
        toast,
        openModal,
        closeModal,
        requireLogin,
        initTheme,
        toggleTheme,
        buildSidebar,
        showLightbox,
        debounce,
        paginationHTML
    } from './js/utils.js';

    window.toggleTheme = toggleTheme;
    window.closeModal = closeModal;
    window.showLightbox = showLightbox;

    const user = requireLogin();
    if (!user) throw new Error('not logged in');
    initTheme();
    buildSidebar('flows', api);

    const params    = new URLSearchParams(location.search);
    const flowId    = params.get('flowId');
    const projectId = params.get('projectId');
    const moduleId  = params.get('moduleId');

    if (!flowId) {
        window.location.href = '/projects.html';
    }

    let flow = null;
    let eventSource = null;
    let activeFilter = 'ALL';
    let searchQuery = '';
    let stepPage = 0;
    const stepsPerPage = 25;
    let environmentsCache = [];

    // O(1) Lookup Maps
    let stepById = new Map();
    let domById = new Map();

    function rebuildMaps() {
        stepById.clear();
        if (flow && flow.steps) {
            flow.steps.forEach(s => stepById.set(s.stepOrder, s));
        }
        rebuildDomMap();
    }

    function rebuildDomMap() {
        domById.clear();
        const cards = document.querySelectorAll('.step-card');
        cards.forEach(card => {
            const stepOrderStr = card.getAttribute('data-step-order');
            if (stepOrderStr) {
                domById.set(Number(stepOrderStr), card);
            }
        });
    }

    // Screenshot presigned URL cache
    const ssCache = {};

    // Viewer state
    let selectedStepOrder = null;
    let selectedScreenshotIndex = 0;
    let currentScreenshots = [];
    let screenshotViewMode = 'slideshow'; // 'vertical' or 'slideshow'
    let autoSlideTimer = null;

    // Step list viewer state
    let stepViewMode = 'vertical'; // 'vertical' or 'slideshow'
    let stepSlideshowIndex = 0;
    let stepSlideDirection = 'next'; // 'next' or 'prev' — drives the slide transition direction
    const stepAutoSlideMs = 4000;
    let stepAutoSlideTimer = null;


    // ── ACTION TYPE CONFIG ─────────────────────────────────────────────
    const ACTION_CONFIG = {
        NAVIGATE:    { icon: '🔗', label: 'Navigate',    color: 'var(--blue)', bg: 'var(--blue-d)', bc: 'var(--blue-b)' },
        CLICK:       { icon: '👆', label: 'Click',       color: 'var(--am)',   bg: 'var(--am-d)',   bc: 'var(--am-b)' },
        TYPE:        { icon: '⌨️', label: 'Type',        color: 'var(--pu)',   bg: 'var(--pu-d)',   bc: 'var(--pu-b)' },
        SELECT:      { icon: '📋', label: 'Select',      color: 'var(--te)',   bg: 'var(--te-d)',   bc: 'var(--te-b)' },
        CHECKBOX:    { icon: '☑️', label: 'Checkbox',    color: 'var(--gr)',   bg: 'var(--gr-d)',   bc: 'var(--gr-b)' },
        RADIO:       { icon: '🔘', label: 'Radio',       color: 'var(--blue)', bg: 'var(--blue-d)', bc: 'var(--blue-b)' },
        DATE:        { icon: '📅', label: 'Date',        color: 'var(--am)',   bg: 'var(--am-d)',   bc: 'var(--am-b)' },
        FILE_UPLOAD: { icon: '📎', label: 'Upload',      color: 'var(--pu)',   bg: 'var(--pu-d)',   bc: 'var(--pu-b)' },
        HOVER:       { icon: '🖱️', label: 'Hover',      color: 'var(--te)',   bg: 'var(--te-d)',   bc: 'var(--te-b)' },
        WAIT:        { icon: '⏳', label: 'Wait',        color: 'var(--tx2)',  bg: 'var(--sur3)',   bc: 'var(--bd)' },
        SCROLL:      { icon: '📜', label: 'Scroll',      color: 'var(--tx2)',  bg: 'var(--sur3)',   bc: 'var(--bd)' },
        PRESS_KEY:   { icon: '⌨️', label: 'Key Press',   color: 'var(--pu)',   bg: 'var(--pu-d)',   bc: 'var(--pu-b)' },
        DRAG_DROP:   { icon: '↕️', label: 'Drag & Drop', color: 'var(--am)',   bg: 'var(--am-d)',   bc: 'var(--am-b)' },
        VERIFY:      { icon: '✅', label: 'Verify',      color: 'var(--gr)',   bg: 'var(--gr-d)',   bc: 'var(--gr-b)' },
    };

    function getActionCfg(type) {
        return ACTION_CONFIG[type] || { icon: '❓', label: type || '—', color: 'var(--tx2)', bg: 'var(--sur3)', bc: 'var(--bd)' };
    }

    // ── HELPERS ─────────────────────────────────────────────────────────
    function formatDuration(ms) {
        if (!ms && ms !== 0) return '—';
        if (ms < 1000) return `${ms}ms`;
        if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
        const m = Math.floor(ms / 60000);
        const s = Math.round((ms % 60000) / 1000);
        return `${m}m ${s}s`;
    }

    function isSensitive(step) {
        const name = (step.name || '').toLowerCase();
        return (step.actionType === 'TYPE') &&
            (name.includes('password') || name.includes('secret') || name.includes('token'));
    }

    function maskValue(val) {
        if (!val) return '—';
        return '•'.repeat(Math.min(val.length, 12));
    }

    function truncate(str, max = 40) {
        if (!str) return '—';
        return str.length > max ? str.slice(0, max) + '…' : str;
    }

    function stepStatusClass(status) {
        const s = (status || '').toUpperCase();
        if (s === 'PASSED') return 'step-passed';
        if (s === 'FAILED') return 'step-failed';
        if (s === 'RUNNING') return 'step-running';
        return '';
    }

    // ── SCREENSHOT PRESIGNING ───────────────────────────────────────────
    async function getScreenshotUrls(step) {
        if (!flow.flowBasePath) return [];
        const prefix = `${flow.flowBasePath}/${step.stepOrder}/screenshots/`;
        if (ssCache[prefix]) return ssCache[prefix];
        try {
            const res = await api.runs.getScenarioScreenshots(prefix);
            if (res && res.screenshots && res.screenshots.length > 0) {
                ssCache[prefix] = res.screenshots;
                return res.screenshots;
            }
            return [];
        } catch {
            return [];
        }
    }

    // ── LOAD FLOW ───────────────────────────────────────────────────────
    async function load() {
        try {
            flow = await api.flows.get(flowId);
            rebuildMaps();

            document.getElementById('crumb-flow').textContent = flow.name || 'Flow Detail';
            document.title = `${flow.name || 'Flow Detail'} — QA Studio`;

            // Breadcrumb links
            const pid = flow.projectId || projectId;
            const mid = flow.moduleId || moduleId;
            if (pid) {
                try {
                    const proj = await api.projects.get(pid);
                    document.getElementById('crumb-proj').textContent = proj.name;
                } catch {}
                document.getElementById('crumb-proj').onclick = () =>
                    window.location.href = `/modules.html?projectId=${pid}`;
            }
            if (pid && mid) {
                try {
                    const mod = await api.modules.get(mid);
                    document.getElementById('crumb-mod').textContent = mod.name;
                } catch {}
                document.getElementById('crumb-mod').onclick = () =>
                    window.location.href = `/flows.html?projectId=${pid}&moduleId=${mid}`;
            }

            renderPage();

            // Load environments silently so the Run modal is instant
            if (pid) {
                try { environmentsCache = await api.environments.list(pid); } catch { environmentsCache = []; }
            }

            if (flow.executionStatus === 'RUNNING') {
                startSseStream();
            } else if (flow.executionStatus === 'FAILED') {
                // Only auto-open failed step when flow is already completed with failure
                setTimeout(() => navigateToFirstFailed(), 350);
            }

        } catch (e) {
            document.getElementById('page-content').innerHTML = `
                <div class="empty">
                    <div class="ei">⚠️</div>
                    <h3>Failed to load flow</h3>
                    <p>${esc(e.message || 'Unknown error')}</p>
                </div>
            `;
        }
    }

    // ── SSE STREAM ──────────────────────────────────────────────────────
    function startSseStream() {
        // Don't open duplicate connections
        if (eventSource) return;

        console.log('[SSE] Connecting to /api/flows/' + flowId + '/stream');
        eventSource = new EventSource(`/api/flows/${flowId}/stream`);

        // Handle flow start
        eventSource.addEventListener('flow-started', (event) => {
            try {
                flow = JSON.parse(event.data);
                rebuildMaps();
                updateHeroStats();
                updateStepList(); // force full refresh to reset all UI
                console.log('[SSE] flow-started');
            } catch (err) {
                console.error('[SSE] Error parsing flow-started:', err);
            }
        });

        // Helper to update a single step incrementally using O(1) lookups
        const updateFlowStepLocal = (event) => {
            try {
                const stepEvent = JSON.parse(event.data);
                if (stepById.has(stepEvent.stepOrder)) {
                    const step = stepById.get(stepEvent.stepOrder);
                    step.executionStatus = stepEvent.executionStatus;
                    step.executionMessage = stepEvent.executionMessage;
                    if (stepEvent.screenshotUrl) {
                        step.screenshotUrl = stepEvent.screenshotUrl;
                    }

                    // Update overall hero statistics
                    updateHeroStats();

                    // O(1) DOM update for the specific step if it's currently rendered
                    const card = domById.get(step.stepOrder);
                    if (card) {
                        card.classList.remove('step-passed', 'step-failed', 'step-running');
                        const newCls = stepStatusClass(step.executionStatus);
                        if (newCls) card.classList.add(newCls);

                        const meta = card.querySelector('.step-meta');
                        if (meta) {
                            meta.innerHTML = statusBadge(step.executionStatus || 'NOT_STARTED');
                        }

                        if (selectedStepOrder === step.stepOrder) {
                            renderDetailPanel(step);
                        }
                    }
                }
            } catch (err) {
                console.error('[SSE] Error updating step local:', err);
            }
        };

        // Handle fine-grained step events
        eventSource.addEventListener('step-started', updateFlowStepLocal);
        eventSource.addEventListener('step-updated', updateFlowStepLocal);
        eventSource.addEventListener('step-failed', updateFlowStepLocal);

        // Handle completion/failure/cancellation
        const handleFlowEnd = (event) => {
            try {
                flow = JSON.parse(event.data);
                rebuildMaps();
                updateHeroStats();
                const isCancelled = flow.executionStatus === 'CANCELLED';
                toast(isCancelled ? 'Flow execution cancelled' : 'Flow execution completed', 
                      flow.executionStatus === 'PASSED' ? 'success' : (isCancelled ? 'warning' : 'error'));
                if (flow.executionStatus === 'FAILED') {
                    setTimeout(() => navigateToFirstFailed(), 350);
                }
                console.log('[SSE] flow ended, status:', flow.executionStatus);
            } catch (err) {
                console.error('[SSE] Error parsing flow end event:', err);
            }
            stopSseStream();
        };

        eventSource.addEventListener('flow-completed', handleFlowEnd);
        eventSource.addEventListener('flow-failed', handleFlowEnd);
        eventSource.addEventListener('flow-cancelled', handleFlowEnd);

        // Handle connection errors — fall back to a one-time poll
        eventSource.onerror = (err) => {
            console.warn('[SSE] Connection error, falling back to poll', err);
            stopSseStream();
            // Fallback: do a single poll after a delay to see if the flow is done
            setTimeout(async () => {
                try {
                    flow = await api.flows.get(flowId);
                    rebuildMaps();
                    updateHeroStats();
                    if (flow.executionStatus === 'RUNNING') {
                        // Retry SSE connection
                        startSseStream();
                    } else {
                        const isCancelled = flow.executionStatus === 'CANCELLED';
                        toast(isCancelled ? 'Flow execution cancelled' : 'Flow execution completed', 
                              flow.executionStatus === 'PASSED' ? 'success' : (isCancelled ? 'warning' : 'error'));
                        if (flow.executionStatus === 'FAILED') {
                            setTimeout(() => navigateToFirstFailed(), 350);
                        }
                    }
                } catch {}
            }, 2000);
        };
    }

    function stopSseStream() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
            console.log('[SSE] Stream closed');
        }
    }

    // Clean up on page unload
    window.addEventListener('beforeunload', stopSseStream);

    // ── NAVIGATE TO FIRST FAILED STEP ────────────────────────────────────
    function navigateToFirstFailed() {
        if (!flow || !flow.steps || flow.steps.length === 0) return;

        const sorted = [...flow.steps].sort((a, b) => (a.stepOrder || 0) - (b.stepOrder || 0));
        const failedStep = sorted.find(s => s.executionStatus === 'FAILED');
        if (!failedStep) return; // No failed step — don't auto-open anything

        // Apply current filter/search and find which page this step is on
        const filtered = filterSteps(sorted);
        const idx = filtered.findIndex(s => s.stepOrder === failedStep.stepOrder);
        if (idx === -1) {
            // Failed step is hidden by current filter — reset filter to ALL
            activeFilter = 'ALL';
            searchQuery = '';
            const filtered2 = filterSteps(sorted);
            const idx2 = filtered2.findIndex(s => s.stepOrder === failedStep.stepOrder);
            if (idx2 === -1) return;
            stepPage = Math.floor(idx2 / stepsPerPage);
        } else {
            stepPage = Math.floor(idx / stepsPerPage);
        }

        // Re-render steps with the correct page
        renderSteps();

        // Expand the failed step and scroll to it
        selectStep(failedStep.stepOrder);
        setTimeout(() => {
            const card = document.getElementById(`step-card-${failedStep.stepOrder}`);
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    }

        // Wire search
        const searchInp = document.getElementById('step-search-inp');
        if (searchInp) {

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QA Studio — Flow Execution</title>
    <meta name="description" content="View flow execution details, step-by-step results, and screenshots for QA automation flows.">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* ── Flow Detail page-specific styles ─────────────────────── */

        /* Hero summary */
        .flow-hero {
            background: var(--sur);
            border: 1px solid var(--bd);
            border-radius: var(--r);
            padding: 22px 24px;
            margin-bottom: 20px;
        }
        .flow-hero-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .flow-hero-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.4px;
            margin-bottom: 6px;
        }
        .flow-hero-desc {
            font-size: 13px;
            /*color: var(--tx2);*/
            margin-top: 4px;
            line-height: 1.5;
        }
        .flow-stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
        }
        .flow-stat-label {
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--tx2);
            margin-bottom: 3px;
        }
        .flow-stat-val {
            font-size: 13.5px;
        }
        .flow-stat-val strong {
            font-weight: 800;
        }
        .stat-counts {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .stat-counts .badge {
            font-size: 10.5px;
            font-weight: 700;
        }

        /* Step filter bar */
        .step-filter-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background: var(--sur);
            border: 1px solid var(--bd);
            border-radius: var(--r);
            padding: 10px 14px;
            margin-bottom: 14px;
        }
        .step-count-label {
            font-size: 12px;
            color: var(--tx2);
            font-weight: 600;
            margin-left: auto;
        }

        /* Step list (single column layout) */
        .step-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 1000px;
        }

        /* Inline detail panel (expands below step card) */
        .step-inline-detail {
            display: none;
            border-top: 1px solid var(--bd);
            background: var(--sur2);
            padding: 20px;
            animation: slideDown .2s ease;
        }
        .step-card.selected .step-inline-detail {
            display: block;
        }
        @keyframes slideDown {
            from { opacity: 0; max-height: 0; }
            to   { opacity: 1; max-height: 3000px; }
        }

        /* Step card */
        .step-card {
            background: var(--sur);
            border: 1.5px solid var(--bd);
            border-radius: var(--r);
            overflow: hidden;
            transition: border-color .14s, box-shadow .14s;
            cursor: pointer;
        }
        .step-card.selected {
            border-color: var(--blue);
            box-shadow: 0 0 0 1px var(--blue);
            background: var(--sur2);
        }
        .step-card:hover {
            border-color: var(--bd2);
        }
        .step-card.selected:hover {
            border-color: var(--blue);
        }
        .step-card.step-failed {
            border-left: 3px solid var(--rd);
        }
        .step-card.step-failed.selected {
            background: linear-gradient(90deg, rgba(239,68,98,.04) 0%, transparent 40%);
            border-color: var(--rd);
            box-shadow: 0 0 0 1px var(--rd);
        }
        .step-card.step-passed {
            border-left: 3px solid var(--gr);
        }
        .step-card.step-running {
            border-left: 3px solid var(--am);
            animation: pulse 2s ease-in-out infinite;
        }

        /* Step head (collapsed view) */
        .step-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            user-select: none;
            transition: background .12s;
        }
        .step-head:hover {
            background: var(--sur2);
        }
        .step-num {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--sur2);
            border: 1.5px solid var(--bd);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            font-family: var(--mono);
            color: var(--tx2);
            flex-shrink: 0;
        }
        .step-failed .step-num {
            background: var(--rd-d);
            border-color: var(--rd-b);
            color: var(--rd);
        }
        .step-passed .step-num {
            background: var(--gr-d);
            border-color: var(--gr-b);
            color: var(--gr);
        }

        .action-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 10.5px;
            font-weight: 700;
            border: 1px solid transparent;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .step-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .step-name-text {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .step-selector-text {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--tx3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 320px;
        }
        .step-value-text {
            font-size: 11.5px;
            color: var(--tx2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }
        .step-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .step-duration {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--tx3);
        }
        .step-thumb {
            width: 56px;
            height: 36px;
            border-radius: 4px;
            border: 1px solid var(--bd);
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            transition: border-color .14s, box-shadow .14s;
            background: var(--sur2);
        }
        .step-thumb:hover {
            border-color: var(--blue-b);
            box-shadow: 0 2px 8px rgba(47,128,240,.2);
        }
        .step-failed .step-thumb {
            border-color: var(--rd-b);
            box-shadow: 0 0 12px rgba(239,68,98,.25);
        }
        .step-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .step-thumb-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--tx3);
            font-size: 14px;
        }
        .step-chevron {
            font-size: 10px;
            color: var(--tx3);
            transition: transform .15s;
            flex-shrink: 0;
        }
        .step-card.open .step-chevron {
            transform: rotate(180deg);
        }

        /* Step body (expanded view) */
        .step-body {
            border-top: 1px solid var(--bd);
            background: var(--sur2);
            padding: 18px;
            display: none;
        }
        .step-card.open .step-body {
            display: block;
        }

        .step-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .step-detail-item {
            min-width: 0;
        }
        .step-detail-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--tx3);
            margin-bottom: 4px;
        }
        .step-detail-value {
            font-size: 12.5px;
            word-break: break-all;
        }
        .step-detail-value code {
            font-family: var(--mono);
            font-size: 11.5px;
            background: var(--sur3);
            padding: 2px 6px;
            border-radius: var(--rx);
            color: var(--blue);
            word-break: break-all;
        }

        /* Failure alert */
        .step-error-alert {
            background: var(--rd-d);
            border: 1px solid var(--rd-b);
            border-radius: var(--rs);
            padding: 12px 16px;
            margin-top: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .step-error-alert .alert-icon {
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .step-error-alert .alert-text {
            font-size: 12.5px;
            color: var(--rd);
            font-weight: 500;
            line-height: 1.5;
            word-break: break-word;
        }

        /* Screenshot in expanded view */
        .step-screenshot-section {
            margin-top: 14px;
        }
        .step-screenshots-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .step-screenshot-preview {
            max-width: 360px;
            border: 1px solid var(--bd);
            border-radius: var(--rs);
            overflow: hidden;
            cursor: pointer;
            transition: all .14s;
            background: var(--sur3);
        }
        .step-screenshot-preview:hover {
            border-color: var(--blue-b);
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(47,128,240,.15);
        }
        .step-failed .step-screenshot-preview {
            max-width: 480px;
            border-color: var(--rd-b);
            box-shadow: 0 0 16px rgba(239,68,98,.2);
        }
        .step-screenshot-preview img {
            width: 100%;
            display: block;
        }
        .step-screenshot-caption {
            padding: 6px 10px;
            font-size: 10.5px;
            color: var(--tx3);
            font-family: var(--mono);
            background: var(--sur2);
        }

        /* Tooltip */
        .has-tooltip {
            position: relative;
        }
        .has-tooltip:hover .tooltip-text {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .tooltip-text {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 0;
            background: var(--sur3);
            border: 1px solid var(--bd2);
            border-radius: var(--rx);
            padding: 6px 10px;
            font-size: 11px;
            font-family: var(--mono);
            color: var(--tx);
            white-space: nowrap;
            max-width: 420px;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transform: translateY(4px);
            transition: all .14s;
            pointer-events: none;
            box-shadow: 0 4px 12px rgba(0,0,0,.3);
        }

        /* Masked value */
        .masked-value {
            font-family: var(--mono);
            letter-spacing: 1px;
            color: var(--tx3);
        }

        /* Thumbnail strip & Preview */
        .sv-main {
            position: relative;
            background: var(--sur2);
            border: 1px solid var(--bd);
            border-radius: var(--rs);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            overflow: hidden;
        }
        .sv-image-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .sv-image-container img {
            max-width: 100%;
            max-height: 600px;
            object-fit: contain;
            cursor: pointer;
            border-radius: var(--rs);
        }
        .sv-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            z-index: 10;
            transition: background .2s;
        }
        .sv-nav-btn:hover:not(:disabled) {
            background: rgba(0,0,0,0.9);
        }
        .sv-nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }
        .sv-nav-btn.prev { left: 16px; }
        .sv-nav-btn.next { right: 16px; }
        
        .sv-thumbnails {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .sv-thumb {
            flex: 0 0 140px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
        }
        .sv-thumb-img-wrap {
            width: 140px;
            height: 85px;
            border: 2px solid transparent;
            border-radius: var(--rx);
            overflow: hidden;
            background: var(--sur2);
            transition: border-color .2s;
        }
        .sv-thumb.selected .sv-thumb-img-wrap {
            border-color: var(--blue);
        }
        .sv-thumb:hover .sv-thumb-img-wrap {
            border-color: var(--blue-b);
        }
        .sv-thumb.selected:hover .sv-thumb-img-wrap {
            border-color: var(--blue);
        }
        .sv-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sv-thumb-label {
            font-size: 11px;
            text-align: center;
            color: var(--tx2);
            font-weight: 500;
        }
        .sv-thumb.selected .sv-thumb-label {
            color: var(--blue);
            font-weight: 700;
        }

        /* Progress bar for running flows */
        .flow-progress {
            margin-top: 14px;
        }
        .flow-progress-bar {
            height: 4px;
            background: var(--sur3);
            border-radius: 99px;
            overflow: hidden;
        }
        .flow-progress-fill {
            height: 100%;
            border-radius: 99px;
            transition: width .3s ease;
        }
        .flow-progress-label {
            font-size: 11px;
            color: var(--tx3);
            margin-top: 5px;
            text-align: right;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .step-detail-grid {
                grid-template-columns: 1fr;
            }
            .flow-stats {
                grid-template-columns: 1fr 1fr;
            }
            .step-selector-text,
            .step-value-text {
                max-width: 150px;
            }
            .step-head {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
<div id="toasts"></div>
<div id="modal-root"></div>

<div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-col">

        <div class="topbar">
            <div class="crumb">
                <a class="crumb-link" href="/projects.html">Projects</a>
                <span class="crumb-sep">›</span>
                <span class="crumb-link" id="crumb-proj" style="cursor:pointer">…</span>
                <span class="crumb-sep">›</span>
                <span class="crumb-link" id="crumb-mod" style="cursor:pointer">…</span>
                <span class="crumb-sep">›</span>
                <span class="crumb-cur" id="crumb-flow">Flow Detail</span>
            </div>
            <div class="topbar-right">
                <button class="btn-icon theme-btn" onclick="toggleTheme()">☀</button>
            </div>
        </div>

        <div class="main-scroll">
            <div class="page">
                <div id="page-content">
                    <div class="spinner-wrap"><div class="spinner"></div></div>
                </div>
            </div>
        </div>

    </div>
</div>

<script type="module">
    import * as api from './js/api.js';
    import {
        esc,
        statusBadge,
        timeAgo,
        fmtDate,
        toast,
        openModal,
        closeModal,
        requireLogin,
        initTheme,
        toggleTheme,
        buildSidebar,
        showLightbox,
        debounce,
        paginationHTML
    } from './js/utils.js';

    window.toggleTheme = toggleTheme;
    window.closeModal = closeModal;
    window.showLightbox = showLightbox;

    const user = requireLogin();
    if (!user) throw new Error('not logged in');
    initTheme();
    buildSidebar('flows', api);

    const params    = new URLSearchParams(location.search);
    const flowId    = params.get('flowId');
    const projectId = params.get('projectId');
    const moduleId  = params.get('moduleId');

    if (!flowId) {
        window.location.href = '/projects.html';
    }

    let flow = null;
    let eventSource = null;
    let activeFilter = 'ALL';
    let searchQuery = '';
    let stepPage = 0;
    const stepsPerPage = 15;

    // Screenshot presigned URL cache
    const ssCache = {};
    
    // Viewer state
    let selectedStepOrder = null;
    let selectedScreenshotIndex = 0;
    let currentScreenshots = [];

    // ── ACTION TYPE CONFIG ─────────────────────────────────────────────
    const ACTION_CONFIG = {
        NAVIGATE:    { icon: '🔗', label: 'Navigate',    color: 'var(--blue)', bg: 'var(--blue-d)', bc: 'var(--blue-b)' },
        CLICK:       { icon: '👆', label: 'Click',       color: 'var(--am)',   bg: 'var(--am-d)',   bc: 'var(--am-b)' },
        TYPE:        { icon: '⌨️', label: 'Type',        color: 'var(--pu)',   bg: 'var(--pu-d)',   bc: 'var(--pu-b)' },
        SELECT:      { icon: '📋', label: 'Select',      color: 'var(--te)',   bg: 'var(--te-d)',   bc: 'var(--te-b)' },
        CHECKBOX:    { icon: '☑️', label: 'Checkbox',    color: 'var(--gr)',   bg: 'var(--gr-d)',   bc: 'var(--gr-b)' },
        RADIO:       { icon: '🔘', label: 'Radio',       color: 'var(--blue)', bg: 'var(--blue-d)', bc: 'var(--blue-b)' },
        DATE:        { icon: '📅', label: 'Date',        color: 'var(--am)',   bg: 'var(--am-d)',   bc: 'var(--am-b)' },
        FILE_UPLOAD: { icon: '📎', label: 'Upload',      color: 'var(--pu)',   bg: 'var(--pu-d)',   bc: 'var(--pu-b)' },
        HOVER:       { icon: '🖱️', label: 'Hover',      color: 'var(--te)',   bg: 'var(--te-d)',   bc: 'var(--te-b)' },
        WAIT:        { icon: '⏳', label: 'Wait',        color: 'var(--tx2)',  bg: 'var(--sur3)',   bc: 'var(--bd)' },
        SCROLL:      { icon: '📜', label: 'Scroll',      color: 'var(--tx2)',  bg: 'var(--sur3)',   bc: 'var(--bd)' },
        PRESS_KEY:   { icon: '⌨️', label: 'Key Press',   color: 'var(--pu)',   bg: 'var(--pu-d)',   bc: 'var(--pu-b)' },
        DRAG_DROP:   { icon: '↕️', label: 'Drag & Drop', color: 'var(--am)',   bg: 'var(--am-d)',   bc: 'var(--am-b)' },
        VERIFY:      { icon: '✅', label: 'Verify',      color: 'var(--gr)',   bg: 'var(--gr-d)',   bc: 'var(--gr-b)' },
    };

    function getActionCfg(type) {
        return ACTION_CONFIG[type] || { icon: '❓', label: type || '—', color: 'var(--tx2)', bg: 'var(--sur3)', bc: 'var(--bd)' };
    }

    // ── HELPERS ─────────────────────────────────────────────────────────
    function formatDuration(ms) {
        if (!ms && ms !== 0) return '—';
        if (ms < 1000) return `${ms}ms`;
        if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
        const m = Math.floor(ms / 60000);
        const s = Math.round((ms % 60000) / 1000);
        return `${m}m ${s}s`;
    }

    function isSensitive(step) {
        const name = (step.name || '').toLowerCase();
        return (step.actionType === 'TYPE') &&
               (name.includes('password') || name.includes('secret') || name.includes('token'));
    }

    function maskValue(val) {
        if (!val) return '—';
        return '•'.repeat(Math.min(val.length, 12));
    }

    function truncate(str, max = 40) {
        if (!str) return '—';
        return str.length > max ? str.slice(0, max) + '…' : str;
    }

    function stepStatusClass(status) {
        const s = (status || '').toUpperCase();
        if (s === 'PASSED') return 'step-passed';
        if (s === 'FAILED') return 'step-failed';
        if (s === 'RUNNING') return 'step-running';
        return '';
    }

    // ── SCREENSHOT PRESIGNING ───────────────────────────────────────────
    async function getScreenshotUrls(step) {
        if (!flow.flowBasePath) return [];
        const prefix = `${flow.flowBasePath}/${step.stepOrder}/screenshots/`;
        if (ssCache[prefix]) return ssCache[prefix];
        try {
            const res = await api.runs.getScenarioScreenshots(prefix);
            if (res && res.screenshots && res.screenshots.length > 0) {
                ssCache[prefix] = res.screenshots;
                return res.screenshots;
            }
            return [];
        } catch {
            return [];
        }
    }

    // ── LOAD FLOW ───────────────────────────────────────────────────────
    async function load() {
        try {
            flow = await api.flows.get(flowId);

            document.getElementById('crumb-flow').textContent = flow.name || 'Flow Detail';
            document.title = `${flow.name || 'Flow Detail'} — QA Studio`;

            // Breadcrumb links
            const pid = flow.projectId || projectId;
            const mid = flow.moduleId || moduleId;
            if (pid) {
                try {
                    const proj = await api.projects.get(pid);
                    document.getElementById('crumb-proj').textContent = proj.name;
                } catch {}
                document.getElementById('crumb-proj').onclick = () =>
                    window.location.href = `/modules.html?projectId=${pid}`;
            }
            if (pid && mid) {
                try {
                    const mod = await api.modules.get(mid);
                    document.getElementById('crumb-mod').textContent = mod.name;
                } catch {}
                document.getElementById('crumb-mod').onclick = () =>
                    window.location.href = `/flows.html?projectId=${pid}&moduleId=${mid}`;
            }

            renderPage();

            if (flow.executionStatus === 'RUNNING') {
                startSseStream();
            } else if (flow.executionStatus === 'FAILED') {
                // Only auto-open failed step when flow is already completed with failure
                setTimeout(() => navigateToFirstFailed(), 350);
            }

        } catch (e) {
            document.getElementById('page-content').innerHTML = `
                <div class="empty">
                    <div class="ei">⚠️</div>
                    <h3>Failed to load flow</h3>
                    <p>${esc(e.message || 'Unknown error')}</p>
                </div>
            `;
        }
    }

    // ── SSE STREAM ──────────────────────────────────────────────────────
    function startSseStream() {
        // Don't open duplicate connections
        if (eventSource) return;

        console.log('[SSE] Connecting to /api/flows/' + flowId + '/stream');
        eventSource = new EventSource(`/api/flows/${flowId}/stream`);

        // Handle real-time flow updates (step progress)
        eventSource.addEventListener('flow-update', (event) => {
            try {
                flow = JSON.parse(event.data);
                updateLiveProgress();
                console.log('[SSE] flow-update received, status:', flow.executionStatus);
            } catch (err) {
                console.error('[SSE] Error parsing flow-update:', err);
            }
        });

        // Handle flow completion
        eventSource.addEventListener('flow-completed', (event) => {
            try {
                flow = JSON.parse(event.data);
                updateLiveProgress();
                toast('Flow execution completed', flow.executionStatus === 'PASSED' ? 'success' : 'error');
                if (flow.executionStatus === 'FAILED') {
                    setTimeout(() => navigateToFirstFailed(), 350);
                }
                console.log('[SSE] flow-completed, status:', flow.executionStatus);
            } catch (err) {
                console.error('[SSE] Error parsing flow-completed:', err);
            }
            stopSseStream();
        });

        // Handle connection errors — fall back to a one-time poll
        eventSource.onerror = (err) => {
            console.warn('[SSE] Connection error, falling back to poll', err);
            stopSseStream();
            // Fallback: do a single poll after a delay to see if the flow is done
            setTimeout(async () => {
                try {
                    flow = await api.flows.get(flowId);
                    updateLiveProgress();
                    if (flow.executionStatus === 'RUNNING') {
                        // Retry SSE connection
                        startSseStream();
                    } else {
                        toast('Flow execution completed', flow.executionStatus === 'PASSED' ? 'success' : 'error');
                        if (flow.executionStatus === 'FAILED') {
                            setTimeout(() => navigateToFirstFailed(), 350);
                        }
                    }
                } catch {}
            }, 2000);
        };
    }

    function stopSseStream() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
            console.log('[SSE] Stream closed');
        }
    }

    // Clean up on page unload
    window.addEventListener('beforeunload', stopSseStream);

    // ── NAVIGATE TO FIRST FAILED STEP ────────────────────────────────────
    function navigateToFirstFailed() {
        if (!flow || !flow.steps || flow.steps.length === 0) return;

        const sorted = [...flow.steps].sort((a, b) => (a.stepOrder || 0) - (b.stepOrder || 0));
        const failedStep = sorted.find(s => s.executionStatus === 'FAILED');
        if (!failedStep) return; // No failed step — don't auto-open anything

        // Apply current filter/search and find which page this step is on
        const filtered = filterSteps(sorted);
        const idx = filtered.findIndex(s => s.stepOrder === failedStep.stepOrder);
        if (idx === -1) {
            // Failed step is hidden by current filter — reset filter to ALL
            activeFilter = 'ALL';
            searchQuery = '';
            const filtered2 = filterSteps(sorted);
            const idx2 = filtered2.findIndex(s => s.stepOrder === failedStep.stepOrder);
            if (idx2 === -1) return;
            stepPage = Math.floor(idx2 / stepsPerPage);
        } else {
            stepPage = Math.floor(idx / stepsPerPage);
        }

        // Re-render steps with the correct page
        renderSteps();

        // Expand the failed step and scroll to it
        selectStep(failedStep.stepOrder);
        setTimeout(() => {
            const card = document.getElementById(`step-card-${failedStep.stepOrder}`);
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    }

    // ── RENDER PAGE ─────────────────────────────────────────────────────
    function renderPage() {
        const steps = flow.steps || [];
        const pid = flow.projectId || projectId;
        const mid = flow.moduleId || moduleId;
        const backUrl = pid && mid ? `/flows.html?projectId=${pid}&moduleId=${mid}` : '/projects.html';
        const isRunning = flow.executionStatus === 'RUNNING';

        // Counts
        const total = steps.length;
        const passed = steps.filter(s => s.executionStatus === 'PASSED').length;
        const failed = steps.filter(s => s.executionStatus === 'FAILED').length;
        const draft = steps.filter(s => !s.executionStatus || s.executionStatus === 'DRAFT').length;
        const running = steps.filter(s => s.executionStatus === 'RUNNING').length;
        const skipped = steps.filter(s => s.executionStatus === 'SKIPPED').length;
        let flowCalculatedDuration = flow.executionTime;

        document.getElementById('page-content').innerHTML = `

                    <div>

                            ${statusBadge(flow.executionStatus || 'NOT_STARTED')}
                        </div>
                        ${flow.description ? `<div class="flow-hero-desc">${esc(flow.description)}</div>` : ''}
                    </div>
                </div>

                ${isRunning ? `
                    <div class="flow-progress">
                        <div class="flow-progress-bar">
                            <div class="flow-progress-fill" style="width:${progressPct}%;background:linear-gradient(90deg, var(--blue), var(--te))"></div>
                        </div>
                        <div class="flow-progress-label">${completedSteps}/${total} steps completed (${progressPct}%)</div>
                    </div>
                ` : ''}

                <div class="flow-stats" style="margin-top:${isRunning ? '14px' : '0'}">
                    <div>
                        <div class="flow-stat-label">Total Steps</div>
                        <div class="flow-stat-val"><strong>${total}</strong></div>
                    </div>
                    <div>
                        <div class="flow-stat-label">Results</div>
                        <div class="stat-counts">
                            ${passed ? `<span class="badge badge-passed">${passed} Passed</span>` : ''}
                            ${failed ? `<span class="badge badge-failed">${failed} Failed</span>` : ''}
                            ${running ? `<span class="badge badge-running">${running} Running</span>` : ''}
                            ${draft ? `<span class="badge badge-pending">${draft} DRAFT</span>` : ''}
                            ${skipped ? `<span class="badge badge-pending">${skipped} Skipped</span>` : ''}
                        </div>
                    </div>
                    <div>
                        <div class="flow-stat-label">Started</div>
                        <div class="flow-stat-val" style="font-size:12px">${fmtDate(flow.executionStartedAt)}</div>
                    </div>
                    <div>
                        <div class="flow-stat-label">Completed</div>
                        <div class="flow-stat-val" style="font-size:12px">${fmtDate(flow.executionCompletedAt)}</div>
                    </div>
                    <div>
                        <div class="flow-stat-label">Duration</div>
                        <div class="flow-stat-val"><strong>${formatDuration(flowCalculatedDuration)}</strong></div>
                    </div>
                    <div>
                        <div class="flow-stat-label">Default Wait</div>
                        <div class="flow-stat-val">${flow.defaultWait || 5000}ms</div>
                    </div>
                </div>

                ${flow.executionMessage ? `
    <div class="step-error-alert"
         style="margin-top:16px;
                background:${flow.executionStatus === 'FAILED' ? '#ffe5e5' : '#e6ffed'};
                color:${flow.executionStatus === 'FAILED' ? '#d32f2f' : '#2e7d32'};
                border:1px solid ${flow.executionStatus === 'FAILED' ? '#f5c2c2' : '#b7ebc6'};">

        <span class="alert-icon">
            ${flow.executionStatus === 'FAILED' ? '⚠️' : '✅'}
        </span>

        <span class="alert-text">
            ${esc(flow.executionMessage)}
        </span>
    </div>
` : ''}
            </div>

            <!-- Step filter bar -->
            <div class="step-filter-bar">
                <div class="status-filters">
                    <button class="sf-btn ${activeFilter === 'ALL' ? 'sel-all' : ''}" onclick="setFilter('ALL')">All</button>
                    <button class="sf-btn ${activeFilter === 'PASSED' ? 'sel-passed' : ''}" onclick="setFilter('PASSED')">Passed</button>
                    <button class="sf-btn ${activeFilter === 'FAILED' ? 'sel-failed' : ''}" onclick="setFilter('FAILED')">Failed</button>
                    <button class="sf-btn ${activeFilter === 'DRAFT' ? 'sel-partial' : ''}" onclick="setFilter('DRAFT')">DRAFT</button>
                </div>
                <div class="filter-sep"></div>
                <input class="inp inp-sm" style="width:220px" id="step-search-inp"
                       placeholder="🔍 Search steps…" value="${esc(searchQuery)}">

        // Wire search
        const searchInp = document.getElementById('step-search-inp');

    // ── LIVE PROGRESS UPDATE (no full re-render) ────────────────────────
    // Updates hero stats, progress bar, and individual step badges/statuses
    // WITHOUT destroying the DOM — preserves open detail panels.
    function updateLiveProgress() {
        const steps = flow.steps || [];
        const isRunning = flow.executionStatus === 'RUNNING';
        const total = steps.length;
        const passed = steps.filter(s => s.executionStatus === 'PASSED').length;
        const failed = steps.filter(s => s.executionStatus === 'FAILED').length;
        const draft = steps.filter(s => s.executionStatus === 'DRAFT').length;
        console.log("draft count "+draft);
        const running = steps.filter(s => s.executionStatus === 'RUNNING').length;
        const skipped = steps.filter(s => s.executionStatus === 'SKIPPED').length;
        const completedSteps = passed + failed + skipped;
        const progressPct = total > 0 ? Math.round((completedSteps / total) * 100) : 0;

        // ── Update rerun button ──
        const rerunBtn = document.getElementById('rerun-btn');
        if (rerunBtn) {
            rerunBtn.disabled = isRunning;
            rerunBtn.innerHTML = isRunning ? '⏳ Running…' : '▶ Run Again';
        }

        // ── Update flow hero status badge ──
        const heroName = document.querySelector('.flow-hero-name');
        if (heroName) {
            const badgeContainer = heroName.nextElementSibling;
            if (badgeContainer) {
                badgeContainer.innerHTML = statusBadge(flow.executionStatus || 'NOT_STARTED');
            }
        }

        // ── Update progress bar ──
        let progressDiv = document.querySelector('.flow-progress');
        if (isRunning) {
            if (!progressDiv) {
                // Insert progress bar after the hero top section
                const heroTop = document.querySelector('.flow-hero-top');
                if (heroTop) {
                    const div = document.createElement('div');
                    div.className = 'flow-progress';
                    div.innerHTML = `
                        <div class="flow-progress-bar">
                            <div class="flow-progress-fill" style="width:${progressPct}%;background:linear-gradient(90deg, var(--blue), var(--te))"></div>
                        </div>
                        <div class="flow-progress-label">${completedSteps}/${total} steps completed (${progressPct}%)</div>
                    `;
                    heroTop.after(div);
                }
            } else {
                const fill = progressDiv.querySelector('.flow-progress-fill');
                const label = progressDiv.querySelector('.flow-progress-label');
                if (fill) fill.style.width = progressPct + '%';
                if (label) label.textContent = `${completedSteps}/${total} steps completed (${progressPct}%)`;
            }
        } else if (progressDiv) {
            progressDiv.remove();
        }

        // ── Update stat counts ──
        const statCounts = document.querySelector('.stat-counts');
        if (statCounts) {
            statCounts.innerHTML = [
                passed ? `<span class="badge badge-passed">${passed} Passed</span>` : '',
                failed ? `<span class="badge badge-failed">${failed} Failed</span>` : '',
                running ? `<span class="badge badge-running">${running} Running</span>` : '',
                draft ? `<span class="badge badge-pending">${draft} Pending</span>` : '',
                skipped ? `<span class="badge badge-pending">${skipped} Skipped</span>` : '',
            ].join('');
        }

        // ── Update timestamps & duration ──
        let flowCalculatedDuration = flow.executionTime;
        if (flow.executionCompletedAt && flow.executionStartedAt) {
            flowCalculatedDuration = new Date(flow.executionCompletedAt) - new Date(flow.executionStartedAt);
        }
        const statVals = document.querySelectorAll('.flow-stats .flow-stat-val');
        // statVals order: [0]=Total Steps, [1]=Results(stat-counts), [2]=Started, [3]=Completed, [4]=Duration, [5]=Default Wait
        if (statVals[2]) statVals[2].innerHTML = `${fmtDate(flow.executionStartedAt)}`;
        if (statVals[3]) statVals[3].innerHTML = `${fmtDate(flow.executionCompletedAt)}`;
        if (statVals[4]) statVals[4].innerHTML = `<strong>${formatDuration(flowCalculatedDuration)}</strong>`;

        // ── Update execution message alert ──
        const heroEl = document.querySelector('.flow-hero');
        let existingAlert = heroEl ? heroEl.querySelector('.step-error-alert') : null;
        if (flow.executionMessage && heroEl) {
            const alertHtml = `
                <div class="step-error-alert"
                     style="margin-top:16px;
                            background:${flow.executionStatus === 'FAILED' ? '#ffe5e5' : '#e6ffed'};
                            color:${flow.executionStatus === 'FAILED' ? '#d32f2f' : '#2e7d32'};
                            border:1px solid ${flow.executionStatus === 'FAILED' ? '#f5c2c2' : '#b7ebc6'};">
                    <span class="alert-icon">${flow.executionStatus === 'FAILED' ? '⚠️' : '✅'}</span>
                    <span class="alert-text">${esc(flow.executionMessage)}</span>
                </div>`;
            if (existingAlert) {
                existingAlert.outerHTML = alertHtml;
            } else {
                // Insert before the closing </div> of the hero
                const statsDiv = heroEl.querySelector('.flow-stats');
                if (statsDiv) statsDiv.insertAdjacentHTML('afterend', alertHtml);
            }
        } else if (existingAlert) {
            existingAlert.remove();
        }

        // ── Update individual step cards (status badge, duration, status class) ──
        for (const step of steps) {
            const card = document.getElementById(`step-card-${step.stepOrder}`);
            if (!card) continue;

            // Update status class
            card.classList.remove('step-passed', 'step-failed', 'step-running');
            const newCls = stepStatusClass(step.executionStatus);
            if (newCls) card.classList.add(newCls);

            // Update status badge in .step-meta
            const meta = card.querySelector('.step-meta');
            if (meta) {
                meta.innerHTML = statusBadge(step.executionStatus || 'NOT_STARTED');
            }

            // Update duration
            let dur = step.executionTime;
            if (step.executionCompletedAt && step.executionStartedAt) {
                dur = new Date(step.executionCompletedAt) - new Date(step.executionStartedAt);
            }
            const durStr = formatDuration(dur);
            // Find or create the duration span
            const infoDiv = card.querySelector('.step-info');
            if (infoDiv) {
                const durationContainer = infoDiv.querySelectorAll('div')[1]; // second div has duration
                if (durationContainer) {
                    let durSpan = durationContainer.querySelector('span[style*="font-family"]');
                    if (durStr && durStr !== '—') {
                        if (durSpan) {
                            durSpan.innerHTML = `⏱ ${durStr}`;
                        } else {
                            durationContainer.insertAdjacentHTML('beforeend',
                                `<span style="font-size:11px; font-weight:600; font-family:var(--mono); color:var(--tx2); background:var(--sur3); padding:1px 7px; border-radius:var(--rx);">⏱ ${durStr}</span>`);
                        }
                    }
                }
            }

            // If this step's detail panel is open, update it live too
            if (selectedStepOrder === step.stepOrder) {
                renderDetailPanel(step);
            }
        }
    }

    // ── RENDER STEPS ────────────────────────────────────────────────────
    function renderSteps() {
        const steps = flow.steps || [];
        const sorted = [...steps].sort((a, b) => (a.stepOrder || 0) - (b.stepOrder || 0));
        const filtered = filterSteps(sorted);
        const total = filtered.length;
        const totalPages = Math.max(1, Math.ceil(total / stepsPerPage));
        stepPage = Math.max(0, Math.min(stepPage, totalPages - 1));
        const start = stepPage * stepsPerPage;
        const pageItems = filtered.slice(start, start + stepsPerPage);

        const listEl = document.getElementById('step-list');
        const pagEl = document.getElementById('step-pagination');
        if (!listEl) return;

        if (!filtered.length) {
            listEl.innerHTML = `
                <div class="empty" style="padding:28px">
                    <div class="ei">${steps.length ? '🔍' : '📋'}</div>
                    <h3>${steps.length ? 'No matching steps' : 'No steps in this flow'}</h3>
                    <p>${steps.length ? 'Try adjusting your filter or search.' : 'This flow has no steps defined.'}</p>
                </div>
            `;
            if (pagEl) pagEl.innerHTML = '';
            return;
        }

        listEl.innerHTML = pageItems.map(step => renderStepCard(step)).join('');
        if (pagEl) {
            pagEl.innerHTML = totalPages > 1 ? paginationHTML(stepPage, totalPages, 'goStepPage') : '';
        }

        // Update count label
        const label = document.getElementById('step-count-label');
        if (label) {
            label.textContent = `${start + 1}–${Math.min(start + stepsPerPage, total)} of ${total} steps (${steps.length} total)`;
        }
    }

    function filterSteps(steps) {
        let result = steps;

        // Status filter
        if (activeFilter !== 'ALL') {
            result = result.filter(s => {
                const status = (s.executionStatus || 'NOT_STARTED').toUpperCase();
                return status === activeFilter;
            });
        }

        // Search filter
        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            result = result.filter(s =>
                (s.name || '').toLowerCase().includes(q) ||
                (s.selector || '').toLowerCase().includes(q) ||
                (s.actionType || '').toLowerCase().includes(q) ||
                (s.value || '').toLowerCase().includes(q) ||
                (s.expectedValue || '').toLowerCase().includes(q)
            );
        }

        return result;
    }

    function renderStepCard(step) {
        const cfg = getActionCfg(step.actionType);
        const statusCls = stepStatusClass(step.executionStatus);
        const isSelected = selectedStepOrder === step.stepOrder;
        
        let calculatedDuration = step.executionTime;
        if (step.executionCompletedAt && step.executionStartedAt) {
            calculatedDuration = new Date(step.executionCompletedAt) - new Date(step.executionStartedAt);
        }
        const durationStr = formatDuration(calculatedDuration);

        return `
            <div class="step-card ${statusCls} ${isSelected ? 'selected' : ''}" id="step-card-${step.stepOrder}">
                <div class="step-head" onclick="selectStep(${step.stepOrder})">
                    <div class="step-num">${step.stepOrder}</div>
                    <div class="step-info">
                        <div style="display:flex; align-items:center; gap:8px; margin-bottom:3px;">
                            <span class="step-name-text" style="font-size:13px; font-weight:600;">${esc(step.name || `Step ${step.stepOrder}`)}</span>
                            <span class="action-badge" style="background:${cfg.bg};color:${cfg.color};border-color:${cfg.bc};font-size:10px;padding:1px 6px;">${cfg.icon} ${cfg.label}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span style="font-size:11px; color:var(--tx3);" id="ss-count-${step.stepOrder}"></span>
                            ${durationStr && durationStr !== '—' ? `<span style="font-size:11px; font-weight:600; font-family:var(--mono); color:var(--tx2); background:var(--sur3); padding:1px 7px; border-radius:var(--rx);">⏱ ${durationStr}</span>` : ''}
                        </div>
                    </div>
                    <div class="step-meta" style="flex-direction:column; align-items:flex-end; gap:4px;">
                        ${statusBadge(step.executionStatus || 'NOT_STARTED')}
                    </div>
                </div>
                <div class="step-inline-detail" id="detail-panel-${step.stepOrder}"></div>
            </div>
        `;
    }

    function renderDetailPanel(step) {
        if (!step) return;

        const panel = document.getElementById(`detail-panel-${step.stepOrder}`);
        if (!panel) return;

        const cfg = getActionCfg(step.actionType);
        const isFailed = step.executionStatus === 'FAILED';
        const sensitive = isSensitive(step);
        
        let calculatedDuration = step.executionTime;
        if (step.executionCompletedAt && step.executionStartedAt) {
            calculatedDuration = new Date(step.executionCompletedAt) - new Date(step.executionStartedAt);
        }

        let html = `
            <div class="step-detail-grid">
                <div class="step-detail-item">
                    <div class="step-detail-label">Action Type</div>
                    <div class="step-detail-value">
                        <span class="action-badge" style="background:${cfg.bg};color:${cfg.color};border-color:${cfg.bc}">${cfg.icon} ${cfg.label}</span>
                    </div>
                </div>
                <div class="step-detail-item">
                    <div class="step-detail-label">Status</div>
                    <div class="step-detail-value">${statusBadge(step.executionStatus || 'NOT_STARTED')}</div>
                </div>
                ${step.selector ? `
                <div class="step-detail-item" style="grid-column: 1 / -1">
                    <div class="step-detail-label">Selector</div>
                    <div class="step-detail-value"><code>${esc(step.selector)}</code></div>
                </div>
                ` : ''}
                ${step.value ? `
                    <div class="step-detail-item">
                        <div class="step-detail-label">Value</div>
                        <div class="step-detail-value">
                            ${sensitive ? `<span class="masked-value">${maskValue(step.value)}</span>` : `<code>${esc(step.value)}</code>`}
                        </div>
                    </div>
                ` : ''}
                ${step.expectedValue ? `
                    <div class="step-detail-item">
                        <div class="step-detail-label">Expected Value</div>
                        <div class="step-detail-value"><code>${esc(step.expectedValue)}</code></div>
                    </div>
                ` : ''}
            </div>
            
            <div class="step-detail-label" style="margin-top:20px; border-bottom:1px solid var(--bd); padding-bottom:4px; margin-bottom:12px;">Execution & Settings</div>
            <div class="step-detail-grid">
                <div class="step-detail-item">
                    <div class="step-detail-label">Started At</div>
                    <div class="step-detail-value" style="font-size:12px">${step.executionStartedAt ? fmtDate(step.executionStartedAt) : '—'}</div>
                </div>
                <div class="step-detail-item">
                    <div class="step-detail-label">Completed At</div>
                    <div class="step-detail-value" style="font-size:12px">${step.executionCompletedAt ? fmtDate(step.executionCompletedAt) : '—'}</div>
                </div>
                <div class="step-detail-item">
                    <div class="step-detail-label">Duration</div>
                    <div class="step-detail-value"><strong>${formatDuration(calculatedDuration)}</strong></div>
                </div>
                <div class="step-detail-item">
                    <div class="step-detail-label">Retry Count</div>
                    <div class="step-detail-value"><code>${step.retryCount ?? 0}</code></div>
                </div>
                <div class="step-detail-item">
                    <div class="step-detail-label">Override Wait</div>
                    <div class="step-detail-value"><code>${step.overrideWait ? 'true' : 'false'}</code></div>
                </div>
                <div class="step-detail-item">
                    <div class="step-detail-label">Continue On Failure</div>
                    <div class="step-detail-value"><code>${step.continueOnFailure ? 'true' : 'false'}</code></div>
                </div>
                <div class="step-detail-item">
                    <div class="step-detail-label">Capture Screenshot</div>
                    <div class="step-detail-value"><code>${step.captureScreenshot !== false ? 'true' : 'false'}</code></div>
                </div>
            </div>

            ${isFailed && step.executionMessage ? `
                <div class="step-error-alert">
                    <span class="alert-icon">❌</span>
                    <span class="alert-text">${esc(step.executionMessage)}</span>
                </div>
            ` : ''}
            
            ${(!isFailed && step.executionMessage) ? `
                <div style="margin-top:8px;padding:8px 12px;background:var(--sur3);border-radius:var(--rs);font-size:12px;color:var(--tx2)">
                    <strong>Message:</strong> ${esc(step.executionMessage)}
                </div>
            ` : ''}

            <div id="screenshot-viewer-container-${step.stepOrder}" style="margin-top: 24px;"></div>
        `;
        panel.innerHTML = html;
    }

    function renderDetailScreenshots(screenshots) {
        if (!selectedStepOrder) return;
        const container = document.getElementById(`screenshot-viewer-container-${selectedStepOrder}`);
        if (!container) return;
        
        if (screenshots === null) {
            container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--tx3);font-size:13px"><div class="spinner" style="margin:0 auto 12px"></div>Loading screenshots…</div>';
            return;
        }
        
        if (screenshots.length === 0) {
            container.innerHTML = `
                <div class="step-detail-label" style="margin-bottom:12px">Screenshots</div>
                <div style="padding:40px;text-align:center;color:var(--tx3);font-size:13px;border:1px dashed var(--bd);border-radius:var(--rs)">No screenshots available for this step</div>
            `;
            return;
        }
        
        const total = screenshots.length;
        const current = screenshots[selectedScreenshotIndex];
        const hasPrev = selectedScreenshotIndex > 0;
        const hasNext = selectedScreenshotIndex < total - 1;
        
        let html = `
            <div class="step-detail-label" style="margin-bottom:12px">Screenshots (${total})</div>
            <div class="sv-main">
                <button class="sv-nav-btn prev" onclick="prevScreenshot()" ${!hasPrev ? 'disabled' : ''}>‹</button>
                <div class="sv-image-container">
                    <img id="sv-main-img" src="${esc(current.url)}" onclick="showLightbox('${esc(current.url)}')" alt="Screenshot" loading="lazy" />
                </div>
                <button class="sv-nav-btn next" onclick="nextScreenshot()" ${!hasNext ? 'disabled' : ''}>›</button>
            </div>
            
            <div class="sv-thumbnails">
                ${screenshots.map((ss, idx) => `
                    <div class="sv-thumb ${idx === selectedScreenshotIndex ? 'selected' : ''}" onclick="selectScreenshot(${idx})" id="sv-thumb-${selectedStepOrder}-${idx}">
                        <div class="sv-thumb-img-wrap">
                            <img src="${esc(ss.url)}" loading="lazy" />
                        </div>
                        <div class="sv-thumb-label">Attempt ${idx + 1}</div>
                    </div>
                `).join('')}
            </div>
        `;
        container.innerHTML = html;
        
        const thumb = document.getElementById(`sv-thumb-${selectedStepOrder}-${selectedScreenshotIndex}`);
        if (thumb) {
            thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
    }

    // ── LOAD SCREENSHOT THUMBNAILS ──────────────────────────────────────
    async function loadScreenshotThumbnails() {
        if (!flow.flowBasePath) {
            document.querySelectorAll('[id^="ss-count-"]').forEach(el => el.textContent = '0 screenshots');
            return;
        }
        const steps = flow.steps || [];

        for (const step of steps) {
            const screenshots = await getScreenshotUrls(step);
            const countEl = document.getElementById(`ss-count-${step.stepOrder}`);
            if (countEl) {
                countEl.textContent = `${screenshots.length} screenshot${screenshots.length !== 1 ? 's' : ''}`;
            }
            
            if (selectedStepOrder === step.stepOrder) {
                currentScreenshots = screenshots;
                renderDetailScreenshots(screenshots);
            }
        }
    }

    // ── INTERACTIVE HANDLERS ────────────────────────────────────────────

    window.selectStep = async function (stepOrder) {
        // Toggle: clicking same step collapses it
        if (selectedStepOrder === stepOrder) {
            selectedStepOrder = null;
            currentScreenshots = [];
            document.querySelectorAll('.step-card').forEach(el => el.classList.remove('selected'));
            return;
        }
        
        // Collapse previous
        document.querySelectorAll('.step-card').forEach(el => el.classList.remove('selected'));
        selectedStepOrder = stepOrder;
        
        const card = document.getElementById(`step-card-${stepOrder}`);
        if (card) {
            card.classList.add('selected');
        }
        
        const step = (flow.steps || []).find(s => s.stepOrder === stepOrder);
        renderDetailPanel(step);
        renderDetailScreenshots(null);
        
        // Scroll the card into view after expansion
        setTimeout(() => {
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 50);
        
        const screenshots = await getScreenshotUrls(step);
        currentScreenshots = screenshots;
        selectedScreenshotIndex = screenshots.length > 0 ? screenshots.length - 1 : 0;
        
        renderDetailScreenshots(screenshots);
    };

    window.selectScreenshot = function(idx) {
        if (idx < 0 || idx >= currentScreenshots.length) return;
        selectedScreenshotIndex = idx;
        renderDetailScreenshots(currentScreenshots);
    };

    window.prevScreenshot = function() {
        window.selectScreenshot(selectedScreenshotIndex - 1);
    };

    window.nextScreenshot = function() {
        window.selectScreenshot(selectedScreenshotIndex + 1);
    };

    document.addEventListener('keydown', (e) => {
        if (selectedStepOrder && currentScreenshots.length > 0) {
            if (e.key === 'ArrowLeft') {
                window.prevScreenshot();
            } else if (e.key === 'ArrowRight') {
                window.nextScreenshot();
            }
        }
    });

    window.setFilter = function (f) {
        activeFilter = f;
        stepPage = 0;
        updateStepList();
    };

    function updateStepList() {
        renderSteps();
    }

    window.goStepPage = function(p) {
        stepPage = p;
        updateStepList();
        const listEl = document.getElementById('step-list');
        if (listEl) listEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    window.openStepScreenshot = async function (stepOrder) {
        const step = (flow.steps || []).find(s => s.stepOrder === stepOrder);
        if (!step) return;
        const screenshots = await getScreenshotUrls(step);
        if (screenshots && screenshots.length > 0) {
            showLightbox(screenshots[0].url);
        } else {
            toast('Screenshot not available', 'warning');
        }
    };

    window.rerunFlow = async function () {
        const btn = document.getElementById('rerun-btn');
        if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Starting…'; }
        try {
            // Close any existing SSE stream before starting a new run
            stopSseStream();
            await api.flows.execute(flowId);
            console.log("executing");
            toast('Flow execution started!', 'success');
            // Reload flow state and immediately connect SSE for real-time updates
            setTimeout(async () => {
                flow = await api.flows.get(flowId);
                renderPage();
                startSseStream();
            }, 500);
        } catch (e) {
            console.log("Failed "+e.message);
            console.log("exception "+ e);
            toast('Failed to start flow: ' + e.message, 'error');
            if (btn) { btn.disabled = false; btn.innerHTML = '▶ Run Again'; }
        }
    };

    // ── BOOT ────────────────────────────────────────────────────────────
    load();
</script>
</body>
</html>

    // ── LIVE PROGRESS UPDATE (no full re-render) ────────────────────────
    // Updates hero stats and progress bar without destroying the DOM.
    // Step individual DOMs are updated via domById map in updateFlowStepLocal.
    function updateHeroStats() {
        const steps = flow.steps || [];
        const isRunning = flow.executionStatus === 'RUNNING';
        const total = steps.length;
        const passed = steps.filter(s => s.executionStatus === 'PASSED').length;
        const failed = steps.filter(s => s.executionStatus === 'FAILED').length;
        const draft = steps.filter(s => s.executionStatus === 'DRAFT').length;
        console.log("draft count "+draft);
        const running = steps.filter(s => s.executionStatus === 'RUNNING').length;
        const skipped = steps.filter(s => s.executionStatus === 'SKIPPED').length;
        const completedSteps = passed + failed + skipped;
        const progressPct = total > 0 ? Math.round((completedSteps / total) * 100) : 0;

        // ── Update rerun and stop buttons ──
        const rerunBtn = document.getElementById('rerun-btn');
        const stopBtn = document.getElementById('stop-btn');
        if (rerunBtn) rerunBtn.style.display = isRunning ? 'none' : 'inline-flex';
        if (stopBtn) stopBtn.style.display = isRunning ? 'inline-flex' : 'none';

        // ── Update flow hero status badge ──
        const heroName = document.querySelector('.flow-hero-name');
        if (heroName) {
            const badgeContainer = heroName.nextElementSibling;
            if (badgeContainer) {
                badgeContainer.innerHTML = statusBadge(flow.executionStatus || 'NOT_STARTED');
            }
        }

        // ── Update progress bar ──
        let progressDiv = document.querySelector('.flow-progress');
        if (isRunning) {
            if (!progressDiv) {
                // Insert progress bar after the hero top section
                const heroTop = document.querySelector('.flow-hero-top');
                if (heroTop) {
                    const div = document.createElement('div');
                    div.className = 'flow-progress';
                    div.innerHTML = `
                        <div class="flow-progress-bar">
                            <div class="flow-progress-fill" style="width:${progressPct}%;background:linear-gradient(90deg, var(--blue), var(--te))"></div>
                        </div>
                        <div class="flow-progress-label">${completedSteps}/${total} steps completed (${progressPct}%)</div>
                    `;
                    heroTop.after(div);
                }
            } else {
                const fill = progressDiv.querySelector('.flow-progress-fill');
                const label = progressDiv.querySelector('.flow-progress-label');
                if (fill) fill.style.width = progressPct + '%';
                if (label) label.textContent = `${completedSteps}/${total} steps completed (${progressPct}%)`;
            }
        } else if (progressDiv) {
            progressDiv.remove();
        }

        // ── Update stat counts ──
        const statCounts = document.querySelector('.stat-counts');
        if (statCounts) {
            statCounts.innerHTML = [
                passed ? `<span class="badge badge-passed">${passed} Passed</span>` : '',
                failed ? `<span class="badge badge-failed">${failed} Failed</span>` : '',
                running ? `<span class="badge badge-running">${running} Running</span>` : '',
                draft ? `<span class="badge badge-pending">${draft} Pending</span>` : '',
                skipped ? `<span class="badge badge-pending">${skipped} Skipped</span>` : '',
            ].join('');
        }

        // ── Update timestamps & duration ──
        let flowCalculatedDuration = flow.executionTime;
        if (flow.executionCompletedAt && flow.executionStartedAt) {
            flowCalculatedDuration = new Date(flow.executionCompletedAt) - new Date(flow.executionStartedAt);
        }
        const elStarted = document.getElementById('stat-started');
        const elCompleted = document.getElementById('stat-completed');
        const elDuration = document.getElementById('stat-duration');
        if (elStarted) elStarted.innerHTML = `${fmtDate(flow.executionStartedAt)}`;
        if (elCompleted) elCompleted.innerHTML = `${fmtDate(flow.executionCompletedAt)}`;
        if (elDuration) elDuration.innerHTML = `<strong>${formatDuration(flowCalculatedDuration)}</strong>`;

        // ── Update execution message alert ──
        const heroEl = document.querySelector('.flow-hero');
        let existingAlert = heroEl ? heroEl.querySelector('.step-error-alert') : null;
        if (flow.executionMessage && heroEl) {
            const alertHtml = `
                <div class="step-error-alert"
                     style="margin-top:16px;
                            background:${flow.executionStatus === 'FAILED' ? '#ffe5e5' : '#e6ffed'};
                            color:${flow.executionStatus === 'FAILED' ? '#d32f2f' : '#2e7d32'};
                            border:1px solid ${flow.executionStatus === 'FAILED' ? '#f5c2c2' : '#b7ebc6'};">
                    <span class="alert-icon">${flow.executionStatus === 'FAILED' ? '⚠️' : '✅'}</span>
                    <span class="alert-text">${esc(flow.executionMessage)}</span>
                </div>`;
            if (existingAlert) {
                existingAlert.outerHTML = alertHtml;
            } else {
                // Insert before the closing </div> of the hero
                const statsDiv = heroEl.querySelector('.flow-stats');
                if (statsDiv) statsDiv.insertAdjacentHTML('afterend', alertHtml);
            }
        } else if (existingAlert) {
            existingAlert.remove();
        }
    }

    // ── RENDER STEPS ────────────────────────────────────────────────────
    function renderSteps() {
        const steps = flow.steps || [];
        const sorted = [...steps].sort((a, b) => (a.stepOrder || 0) - (b.stepOrder || 0));
        const filtered = filterSteps(sorted);
        const total = filtered.length;

        const listEl = document.getElementById('step-list');
        const pagEl = document.getElementById('step-pagination');
        if (!listEl) return;

        if (!filtered.length) {
            listEl.innerHTML = `
                <div class="empty" style="padding:28px">
                    <div class="ei">${steps.length ? '🔍' : '📋'}</div>
                    <h3>${steps.length ? 'No matching steps' : 'No steps in this flow'}</h3>
                    <p>${steps.length ? 'Try adjusting your filter or search.' : 'This flow has no steps defined.'}</p>
                </div>
            `;
            if (pagEl) pagEl.innerHTML = '';
            return;
        }

        if (stepViewMode === 'slideshow') {
            if (stepSlideshowIndex >= total) stepSlideshowIndex = 0;
            if (stepSlideshowIndex < 0) stepSlideshowIndex = total - 1;

            const step = filtered[stepSlideshowIndex];
            const hasMultiple = total > 1;
            const dirClass = stepSlideDirection === 'prev' ? 'dir-prev' : '';
            const autoOn = !!stepAutoSlideTimer;

            listEl.innerHTML = `
                <div class="step-slideshow-wrap">
                    <div class="step-slideshow-container">
                        <button class="slideshow-nav-btn" onclick="prevStepSlide()" ${!hasMultiple ? 'disabled' : ''} aria-label="Previous step" title="Previous step (←)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        </button>
                        <div class="step-slideshow-stage" id="step-slideshow-stage">
                            <div class="step-slideshow-track ${dirClass}">
                                ${renderStepCard(step)}
                            </div>
                        </div>
                        <button class="slideshow-nav-btn" onclick="nextStepSlide()" ${!hasMultiple ? 'disabled' : ''} aria-label="Next step" title="Next step (→)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </button>
                    </div>

                    ${autoOn ? `<div class="slideshow-progress-line"><div class="fill animating" style="animation-duration:${stepAutoSlideMs}ms"></div></div>` : ''}

                    <div class="step-slide-counter">
                        <span>Step ${stepSlideshowIndex + 1} of ${total}</span>
                        <span class="kbd-hint">← →</span>
                        ${hasMultiple ? `<span style="color:var(--tx3)">swipe, use arrow keys, or tap a step below to jump</span>` : ''}
                    </div>

                    ${hasMultiple ? `
                    <div class="step-rail" id="step-rail">
                        ${filtered.map((s, idx) => {
                const rs = (s.executionStatus || '').toUpperCase();
                const railCls = rs === 'PASSED' ? 'rail-passed' : rs === 'FAILED' ? 'rail-failed' : rs === 'RUNNING' ? 'rail-running' : '';
                return `<button class="step-rail-dot ${railCls} ${idx === stepSlideshowIndex ? 'active' : ''}" onclick="jumpToStepSlide(${idx})" title="Step ${s.stepOrder}${s.name ? ': ' + esc(s.name) : ''}">${s.stepOrder}</button>`;
            }).join('')}
                    </div>
                    ` : ''}
                </div>
            `;

            if (pagEl) pagEl.innerHTML = '';
            const label = document.getElementById('step-count-label');
            if (label) label.textContent = `Showing step ${stepSlideshowIndex + 1} of ${total}`;

            rebuildDomMap();

            // Keep the active rail dot scrolled into view
            const activeDot = document.querySelector('.step-rail-dot.active');
            if (activeDot) activeDot.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

            // Auto expand the step card in slideshow mode
            setTimeout(() => {
                if (selectedStepOrder !== step.stepOrder) {
                    selectStep(step.stepOrder);
                } else {
                    const card = document.getElementById('step-card-' + step.stepOrder);
                    if (card) {
                        card.classList.add('selected');
                        renderDetailPanel(step);
                        getScreenshotUrls(step).then(screenshots => {
                            currentScreenshots = screenshots;
                            selectedScreenshotIndex = screenshots.length > 0 ? screenshots.length - 1 : 0;
                            renderDetailScreenshots(screenshots);
                        });
                    }
                }
            }, 0);
            return;
        }

        // Vertical mode pagination
        const totalPages = Math.max(1, Math.ceil(total / stepsPerPage));
        stepPage = Math.max(0, Math.min(stepPage, totalPages - 1));
        const start = stepPage * stepsPerPage;
        const pageItems = filtered.slice(start, start + stepsPerPage);

        listEl.innerHTML = pageItems.map(step => renderStepCard(step)).join('');
        if (pagEl) {
            pagEl.innerHTML = totalPages > 1 ? paginationHTML(stepPage, totalPages, 'goStepPage') : '';
        }

        // Update count label
        const label = document.getElementById('step-count-label');
        if (label) {
            label.textContent = `${start + 1}–${Math.min(start + stepsPerPage, total)} of ${total} steps (${steps.length} total)`;
        }

        rebuildDomMap();

        // Restore selected panel state if re-rendered
        setTimeout(() => {
            if (selectedStepOrder) {
                const card = document.getElementById('step-card-' + selectedStepOrder);
                if (card) {
                    const step = pageItems.find(s => s.stepOrder === selectedStepOrder);
                    if (step) {
                        renderDetailPanel(step);
                        getScreenshotUrls(step).then(screenshots => {
                            currentScreenshots = screenshots;
                            renderDetailScreenshots(screenshots);
                        });
                    }
                }
            }
        }, 0);
    }

    function filterSteps(steps) {
        let result = steps;

        // Status filter
        if (activeFilter !== 'ALL') {
            result = result.filter(s => {
                const status = (s.executionStatus || 'NOT_STARTED').toUpperCase();
                return status === activeFilter;
            });
        }

        // Search filter
        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            result = result.filter(s =>
                (s.name || '').toLowerCase().includes(q) ||
                (s.selector || '').toLowerCase().includes(q) ||
                (s.actionType || '').toLowerCase().includes(q) ||
                (s.value || '').toLowerCase().includes(q) ||
                (s.expectedValue || '').toLowerCase().includes(q)
            );
        }

        return result;
    }

    function renderStepCard(step) {
        const isRunning = flow.executionStatus === 'RUNNING';
        const cfg = getActionCfg(step.actionType);
        const statusCls = stepStatusClass(step.executionStatus);
        const isSelected = selectedStepOrder === step.stepOrder;

        let calculatedDuration = step.executionTime;
        if (step.executionCompletedAt && step.executionStartedAt) {
            calculatedDuration = new Date(step.executionCompletedAt) - new Date(step.executionStartedAt);
        }
        const durationStr = formatDuration(calculatedDuration);

        return `
            <div class="step-card ${statusCls} ${isSelected ? 'selected' : ''}" id="step-card-${step.stepOrder}" data-step-order="${step.stepOrder}">
                <div class="step-head" onclick="selectStep(${step.stepOrder})">
                    <div class="step-num">${step.stepOrder}</div>
                    <div class="step-info">
                        <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                            <span class="action-badge" style="background:${cfg.bg};color:${cfg.color};border-color:${cfg.bc};font-size:10px;padding:1px 6px;">${cfg.icon} ${cfg.label}</span>
                            ${durationStr && durationStr !== '—' ? `<span style="font-size:11px; font-weight:600; font-family:var(--mono); color:var(--tx2); background:var(--sur3); padding:1px 7px; border-radius:var(--rx);">⏱ ${durationStr}</span>` : ''}
                            <span style="font-size:11px; color:var(--tx3);" id="ss-count-${step.stepOrder}"></span>
                        </div>
                        <div style="display:flex; align-items:center; gap:6px;">
                            ${step.selector ? `<span class="step-selector-text" title="${esc(step.selector)}">${esc(step.selector.length > 35 ? step.selector.substring(0, 35) + '...' : step.selector)}</span>` : ''}
                            ${step.value ? `<span class="step-value-text" title="${esc(step.value)}">${esc(step.value.length > 35 ? step.value.substring(0, 35) + '...' : step.value)}</span>` : ''}
                            ${step.expectedValue && !step.value ? `<span class="step-value-text" title="${esc(step.expectedValue)}">${esc(step.expectedValue.length > 35 ? step.expectedValue.substring(0, 35) + '...' : step.expectedValue)}</span>` : ''}
                        </div>
                    </div>
                    <div class="step-meta" style="flex-direction:column; align-items:flex-end; gap:4px;">
                        ${statusBadge(step.executionStatus || 'NOT_STARTED')}
                    </div>
                </div>
                <div class="step-inline-detail" id="detail-panel-${step.stepOrder}"></div>
            </div>
        `;
    }

    function renderDetailPanel(step) {
        if (!step) return;

        const panel = document.getElementById(`detail-panel-${step.stepOrder}`);
        if (!panel) return;

        const isRunning = flow.executionStatus === 'RUNNING';
        const cfg = getActionCfg(step.actionType);
        const isFailed = step.executionStatus === 'FAILED';
        const sensitive = isSensitive(step);

        let calculatedDuration = step.executionTime;
        if (step.executionCompletedAt && step.executionStartedAt) {
            calculatedDuration = new Date(step.executionCompletedAt) - new Date(step.executionStartedAt);
        }

        let html = `
            <div class="step-detail-grid">
                <div class="step-detail-item">
                    <div class="step-detail-label">Action Type</div>
                    <div class="step-detail-value">
                        <span class="action-badge" style="background:${cfg.bg};color:${cfg.color};border-color:${cfg.bc}">${cfg.icon} ${cfg.label}</span>
                    </div>
                </div>
                <div class="step-detail-item">
                    <div class="step-detail-label">Status</div>
                    <div class="step-detail-value">${statusBadge(step.executionStatus || 'NOT_STARTED')}</div>
                </div>
                ${step.selector ? `
                <div class="step-detail-item" style="grid-column: 1 / -1">
                    <div class="step-detail-label">Selector</div>
                    <div class="step-detail-value"><code>${esc(step.selector)}</code></div>
                </div>
                ` : ''}
                ${step.value ? `
                    <div class="step-detail-item">
                        <div class="step-detail-label">Value</div>
                        <div class="step-detail-value">
                            ${sensitive ? `<span class="masked-value">${maskValue(step.value)}</span>` : `<code>${esc(step.value)}</code>`}
                        </div>
                    </div>
                ` : ''}
                ${step.expectedValue ? `
                    <div class="step-detail-item">
                        <div class="step-detail-label">Expected Value</div>
                        <div class="step-detail-value"><code>${esc(step.expectedValue)}</code></div>
                    </div>
                ` : ''}
            </div>
            <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:20px; border-bottom:1px solid var(--bd); padding-bottom:4px; margin-bottom:12px;">
                <div class="step-detail-label" style="margin:0; border:none; padding:0;">Execution & Settings</div>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-ghost btn-xs" onclick="openStepEditor(${step.stepOrder})" ${isRunning ? 'disabled style="opacity:0.5;cursor:not-allowed;" title="Cannot edit while running"' : ''}>✏️ Edit Step</button>
                    <button class="btn btn-outline btn-xs" style="color:#d32f2f; border-color:#d32f2f; ${isRunning ? 'opacity:0.5;cursor:not-allowed;' : ''}" onclick="deleteStep(${step.stepOrder})" ${isRunning ? 'disabled title="Cannot delete while running"' : ''}>🗑️ Delete</button>
                </div>
            </div>
            <div class="step-detail-grid">
                <div class="step-detail-item">
                    <div class="step-detail-label">Started At</div>
                    <div class="step-detail-value" style="font-size:12px">${step.executionStartedAt ? fmtDate(step.executionStartedAt) : '—'}</div>
                </div>
                <div class="step-detail-item">
                    <div class="step-detail-label">Completed At</div>
                    <div class="step-detail-value" style="font-size:12px">${step.executionCompletedAt ? fmtDate(step.executionCompletedAt) : '—'}</div>
                </div>
                <div class="step-detail-item">
                    <div class="step-detail-label">Duration</div>
                    <div class="step-detail-value"><strong>${formatDuration(calculatedDuration)}</strong></div>
                </div>
                <div class="step-detail-item">
                    <div class="step-detail-label">Retry Count</div>
                    <div class="step-detail-value"><code>${step.retryCount ?? 0}</code></div>
                </div>
                <div class="step-detail-item">
                    <div class="step-detail-label">Override Wait</div>
                    <div class="step-detail-value"><code>${step.overrideWait ? 'true' : 'false'}</code></div>
                </div>
                <div class="step-detail-item">
                    <div class="step-detail-label">Continue On Failure</div>
                    <div class="step-detail-value"><code>${step.continueOnFailure ? 'true' : 'false'}</code></div>
                </div>
                <div class="step-detail-item">
                    <div class="step-detail-label">Capture Screenshot</div>
                    <div class="step-detail-value"><code>${step.captureScreenshot !== false ? 'true' : 'false'}</code></div>
                </div>
            </div>

            ${isFailed && step.executionMessage ? `
                <div class="step-error-alert">
                    <span class="alert-icon">❌</span>
                    <span class="alert-text">${esc(step.executionMessage)}</span>
                </div>
            ` : ''}

            ${(!isFailed && step.executionMessage) ? `
                <div style="margin-top:8px;padding:8px 12px;background:var(--sur3);border-radius:var(--rs);font-size:12px;color:var(--tx2)">
                    <strong>Message:</strong> ${esc(step.executionMessage)}
                </div>
            ` : ''}

            <div id="screenshot-viewer-container-${step.stepOrder}" style="margin-top: 24px;"></div>
        `;
        panel.innerHTML = html;
    }

    function renderDetailScreenshots(screenshots) {
        if (!selectedStepOrder) return;
        const container = document.getElementById(`screenshot-viewer-container-${selectedStepOrder}`);
        if (!container) return;

        if (screenshots === null) {
            container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--tx3);font-size:13px"><div class="spinner" style="margin:0 auto 12px"></div>Loading screenshots…</div>';
            return;
        }

        if (screenshots.length === 0) {
            container.innerHTML = `
                <div class="step-detail-label" style="margin-bottom:12px">Screenshots</div>
                <div style="padding:40px;text-align:center;color:var(--tx3);font-size:13px;border:1px dashed var(--bd);border-radius:var(--rs)">No screenshots available for this step</div>
            `;
            return;
        }

        const total = screenshots.length;
        const current = screenshots[selectedScreenshotIndex];
        const hasPrev = selectedScreenshotIndex > 0;
        const hasNext = selectedScreenshotIndex < total - 1;

        let html = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
                <div class="step-detail-label" style="margin-bottom:0">Screenshots (${total})</div>
                <div style="display:flex; gap: 8px; align-items:center">
                    <button class="btn btn-xs ${screenshotViewMode === 'vertical' ? 'btn-primary' : 'btn-ghost'}" onclick="setScreenshotViewMode('vertical')">Vertical</button>
                    <button class="btn btn-xs ${screenshotViewMode === 'slideshow' ? 'btn-primary' : 'btn-ghost'}" onclick="setScreenshotViewMode('slideshow')">Slideshow</button>
                    ${screenshotViewMode === 'slideshow' ? `
                    <label style="font-size:11px; display:flex; align-items:center; gap:4px; margin-left:8px; cursor:pointer;">
                        <input type="checkbox" onchange="toggleAutoSlide(this.checked)" ${autoSlideTimer ? 'checked' : ''}> Auto
                    </label>
                    ` : ''}
                </div>
            </div>
        `;

        if (screenshotViewMode === 'slideshow') {
            html += `
                <div class="sv-main">
                    <button class="sv-nav-btn prev" onclick="prevScreenshot()" ${!hasPrev ? 'disabled' : ''}>‹</button>
                    <div class="sv-image-container">
                        <img id="sv-main-img" src="${esc(current.url)}" onclick="showLightbox('${esc(current.url)}')" alt="Screenshot" loading="lazy" />
                    </div>
                    <button class="sv-nav-btn next" onclick="nextScreenshot()" ${!hasNext ? 'disabled' : ''}>›</button>
                </div>

                <div class="sv-thumbnails">
                    ${screenshots.map((ss, idx) => `
                        <div class="sv-thumb ${idx === selectedScreenshotIndex ? 'selected' : ''}" onclick="selectScreenshot(${idx})" id="sv-thumb-${selectedStepOrder}-${idx}">
                            <div class="sv-thumb-img-wrap">
                                <img src="${esc(ss.url)}" loading="lazy" />
                            </div>
                            <div class="sv-thumb-label">Attempt ${idx + 1}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        } else {
            html += `
                <div class="sv-vertical-list" style="display:flex; flex-direction:column; gap:16px;">
                    ${screenshots.map((ss, idx) => `
                        <div style="border:1px solid var(--bd); border-radius:var(--rs); padding:8px; background:var(--sur2)">
                            <div style="font-size:12px; font-weight:bold; margin-bottom:8px; color:var(--tx2)">Attempt ${idx + 1}</div>
                            <img src="${esc(ss.url)}" style="width:100%; border-radius:var(--rs); cursor:pointer; display:block" onclick="showLightbox('${esc(ss.url)}')" loading="lazy" />
                        </div>
                    `).join('')}
                </div>
            `;
        }

        container.innerHTML = html;

        if (screenshotViewMode === 'slideshow') {
            const thumb = document.getElementById(`sv-thumb-${selectedStepOrder}-${selectedScreenshotIndex}`);
            if (thumb) {
                thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }
    }

    // ── LOAD SCREENSHOT THUMBNAILS ──────────────────────────────────────
    async function loadScreenshotThumbnails() {
        if (!flow.flowBasePath) {
            document.querySelectorAll('[id^="ss-count-"]').forEach(el => el.textContent = '0 screenshots');
            return;
        }
        const steps = flow.steps || [];

        for (const step of steps) {
            const screenshots = await getScreenshotUrls(step);
            const countEl = document.getElementById(`ss-count-${step.stepOrder}`);
            if (countEl) {
                countEl.textContent = `${screenshots.length} screenshot${screenshots.length !== 1 ? 's' : ''}`;
            }

            if (selectedStepOrder === step.stepOrder) {
                currentScreenshots = screenshots;
                renderDetailScreenshots(screenshots);
            }
        }
    }

    // ── INTERACTIVE HANDLERS ────────────────────────────────────────────

    window.selectStep = async function (stepOrder) {
        // Toggle: clicking same step collapses it
        if (selectedStepOrder === stepOrder) {
            selectedStepOrder = null;
            currentScreenshots = [];
            document.querySelectorAll('.step-card').forEach(el => el.classList.remove('selected'));
            return;
        }

        // Collapse previous
        document.querySelectorAll('.step-card').forEach(el => el.classList.remove('selected'));
        selectedStepOrder = stepOrder;

        const card = document.getElementById(`step-card-${stepOrder}`);
        if (card) {
            card.classList.add('selected');
        }

        const step = (flow.steps || []).find(s => s.stepOrder === stepOrder);
        renderDetailPanel(step);
        renderDetailScreenshots(null);

        // Scroll the card into view after expansion
        setTimeout(() => {
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 50);

        const screenshots = await getScreenshotUrls(step);
        currentScreenshots = screenshots;
        selectedScreenshotIndex = screenshots.length > 0 ? screenshots.length - 1 : 0;

        renderDetailScreenshots(screenshots);
    };

    window.selectScreenshot = function(idx) {
        if (idx < 0 || idx >= currentScreenshots.length) return;
        selectedScreenshotIndex = idx;
        renderDetailScreenshots(currentScreenshots);
    };

    window.prevScreenshot = function() {
        // If auto slide is on and we manually navigate, maybe we should not stop it, or just let it continue.
        window.selectScreenshot(selectedScreenshotIndex > 0 ? selectedScreenshotIndex - 1 : currentScreenshots.length - 1); // Loop support for slider
    };

    window.nextScreenshot = function() {
        window.selectScreenshot((selectedScreenshotIndex + 1) % currentScreenshots.length); // Loop support for slider
    };

    window.setScreenshotViewMode = function(mode) {
        screenshotViewMode = mode;
        if (mode !== 'slideshow') {
            if (autoSlideTimer) {
                clearInterval(autoSlideTimer);
                autoSlideTimer = null;
            }
        }
        renderDetailScreenshots(currentScreenshots);
    };

    window.toggleAutoSlide = function(checked) {
        if (checked) {
            if (!autoSlideTimer) {
                autoSlideTimer = setInterval(() => {
                    if (currentScreenshots && currentScreenshots.length > 1) {
                        window.nextScreenshot();
                    }
                }, 2500); // 2.5s slide
            }
        } else {
            if (autoSlideTimer) {
                clearInterval(autoSlideTimer);
                autoSlideTimer = null;
            }
        }
        // renderDetailScreenshots(currentScreenshots); // Re-rendering checkboxes could steal focus, but here it's fine or we just keep it
    };

    document.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        const tag = ((e.target && e.target.tagName) || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea') return; // don't hijack typing (e.g. the search box)

        // In step-slideshow mode, arrow keys move between steps.
        if (stepViewMode === 'slideshow') {
            e.preventDefault();
            if (e.key === 'ArrowLeft') window.prevStepSlide();
            else window.nextStepSlide();
            return;
        }

        // Otherwise, if a step is expanded and has multiple screenshots, browse those instead.
        if (selectedStepOrder && currentScreenshots.length > 0) {
            if (e.key === 'ArrowLeft') window.prevScreenshot();
            else window.nextScreenshot();
        }
    });

    // ── SWIPE NAVIGATION (touch) for the horizontal step slideshow ──────
    (function enableStepSlideshowSwipe() {
        let touchStartX = null;
        let touchStartY = null;

        document.addEventListener('touchstart', (e) => {
            if (stepViewMode !== 'slideshow') return;
            if (!e.target.closest('#step-slideshow-stage')) return;
            const t = e.changedTouches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (touchStartX === null || stepViewMode !== 'slideshow') return;
            const t = e.changedTouches[0];
            const dx = t.clientX - touchStartX;
            const dy = t.clientY - touchStartY;
            touchStartX = null;
            touchStartY = null;
            // Require a clearly horizontal swipe so vertical scrolling isn't hijacked
            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                if (dx < 0) window.nextStepSlide();
                else window.prevStepSlide();
            }
        }, { passive: true });
    })();

    window.setFilter = function (f) {
        activeFilter = f;
        stepPage = 0;
        stepSlideshowIndex = 0;
        updateStepList();
    };

    window.setStepViewMode = function(mode) {
        stepViewMode = mode;
        if (mode !== 'slideshow') {
            if (stepAutoSlideTimer) {
                clearInterval(stepAutoSlideTimer);
                stepAutoSlideTimer = null;
            }
        }
        renderPage();
    };

    window.prevStepSlide = function() {
        stepSlideDirection = 'prev';
        stepSlideshowIndex--;
        renderSteps();
    };

    window.nextStepSlide = function() {
        stepSlideDirection = 'next';
        stepSlideshowIndex++;
        renderSteps();
    };

    // Jump straight to any step from the rail — direction is inferred so the
    // transition still feels natural (forward vs. backward).
    window.jumpToStepSlide = function(idx) {
        if (idx === stepSlideshowIndex) return;
        stepSlideDirection = idx >= stepSlideshowIndex ? 'next' : 'prev';
        stepSlideshowIndex = idx;
        renderSteps();
    };

    window.toggleStepAutoSlide = function(checked) {
        if (checked) {
            if (!stepAutoSlideTimer) {
                stepAutoSlideTimer = setInterval(() => {
                    const steps = flow.steps || [];
                    const filtered = filterSteps([...steps].sort((a, b) => (a.stepOrder || 0) - (b.stepOrder || 0)));
                    if (filtered.length > 1) {
                        window.nextStepSlide();
                    }
                }, stepAutoSlideMs);
            }
            renderSteps(); // draw the progress bar immediately
        } else {
            if (stepAutoSlideTimer) {
                clearInterval(stepAutoSlideTimer);
                stepAutoSlideTimer = null;
            }
            renderSteps(); // remove the progress bar
        }
    };

    function updateStepList() {
        renderSteps();
    }

    window.goStepPage = function(p) {
        stepPage = p;
        updateStepList();
        const listEl = document.getElementById('step-list');
        if (listEl) listEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    window.openStepScreenshot = async function (stepOrder) {
        const step = (flow.steps || []).find(s => s.stepOrder === stepOrder);
        if (!step) return;
        const screenshots = await getScreenshotUrls(step);
        if (screenshots && screenshots.length > 0) {
            showLightbox(screenshots[0].url);
        } else {
            toast('Screenshot not available', 'warning');
        }
    };

    // ── Environment picker helpers ──────────────────────────────────────
    function buildEnvOptions() {
        if (!environmentsCache.length) {
            return `<p style="color:var(--tx3);font-size:13px;margin:4px 0">
                No environments configured for this project.<br>
                Flows will execute using the recorded URLs as-is.
            </p>`;
        }
        const opts = environmentsCache.map(e => {
            const checked = e.isDefault ? 'checked' : '';
            return `
            <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;
                         border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;
                         transition:background 0.15s">
                <input type="radio" name="env-select" value="${esc(e.id)}" ${checked}
                       style="accent-color:var(--pri);width:16px;height:16px">
                <div>
                    <div style="font-weight:600;font-size:13px">${esc(e.name)}</div>
                    <div style="font-size:11px;color:var(--tx3);font-family:monospace">${esc(e.baseUrl)}</div>
                </div>
                ${e.isDefault ? '<span style="margin-left:auto" class="badge badge-blue">Default</span>' : ''}
            </label>`;
        }).join('');
        return `
        <div style="display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto">${opts}</div>
        <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;
                      border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;margin-top:4px">
            <input type="radio" name="env-select" value="" style="accent-color:var(--pri);width:16px;height:16px">
            <div>
                <div style="font-weight:600;font-size:13px">🔗 No Environment</div>
                <div style="font-size:11px;color:var(--tx3)">Use recorded URLs as-is</div>
            </div>
        </label>`;
    }

    function getSelectedEnvId() {
        const sel = document.querySelector('input[name="env-select"]:checked');
        return sel ? (sel.value || null) : null;
    }

    // ── Run button — shows environment picker first ────────────────────────
    window.rerunFlow = function () {
        openModal(`
        <div class="modal">
            <div class="modal-head">
                <h2>▶ Run Flow</h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div style="padding:16px 0">
                <div style="font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:12px;
                            text-transform:uppercase;letter-spacing:.06em">Select Environment</div>
                ${buildEnvOptions()}
            </div>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
                <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                <button class="btn btn-success" onclick="confirmRerunFlow()">▶ Run</button>
            </div>
        </div>`);
    };

    window.confirmRerunFlow = async function () {
        const envId = getSelectedEnvId();
        closeModal();
        const btn = document.getElementById('rerun-btn');
        const stopBtn = document.getElementById('stop-btn');
        if (btn) btn.style.display = 'none';
        if (stopBtn) stopBtn.style.display = 'inline-flex';
        try {
            // Close any existing SSE stream before starting a new run
            stopSseStream();
            await api.flows.execute(flowId, envId);
            console.log('executing with envId:', envId);
            toast('Flow execution started!', 'success');
            // Reload flow state and immediately connect SSE for real-time updates
            setTimeout(async () => {
                flow = await api.flows.get(flowId);
                renderPage();
                startSseStream();
            }, 500);
        } catch (e) {
            console.log('Failed ' + e.message);
            toast('Failed to start flow: ' + e.message, 'error');
            if (btn) { btn.disabled = false; btn.innerHTML = '▶ Run'; btn.style.display = 'inline-flex'; }
            if (stopBtn) stopBtn.style.display = 'none';
        }
    };
    window.stopFlowExecution = function () {
        openModal(`
            <div class="modal">
                <div class="modal-head">
                    <h2>⏹ Stop Execution</h2>
                    <button class="modal-close" onclick="closeModal()">✕</button>
                </div>
                <div style="padding: 20px 0;">
                    <p style="margin: 0; font-size: 14px; color: var(--tx2);">Are you sure you want to stop execution of this flow?</p>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
                    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-danger" onclick="confirmStopFlowExecution()">Stop</button>
                </div>
            </div>
        `);
    };
    window.confirmStopFlowExecution = async function () {
        closeModal();
        try {
            await api.flows.stop(flowId);
            toast('Flow execution stopped', 'warning');
        } catch (e) { toast('Failed to stop: ' + e.message, 'error'); }
    };
    window.editFlow = async function () {
        if (flow.executionStatus === 'RUNNING') {
            toast('Cannot edit flow while execution is running!', 'warning');
            return;
        }
        try {
            const projectData = await fetch(`/api/projects/url/${flow.projectId || projectId}`).then(r => { if (!r.ok) throw new Error('Failed to fetch project'); return r.json(); });

            let extensionId;
            try {
                const res = await api.users.getExtensionId(user.username);
                extensionId = res.extensionId;
            } catch (e) {
                console.error('Failed to fetch extension ID', e);
            }

            if (!extensionId) {
                toast('Please configure your Chrome Extension ID from the Projects page.', 'warning', 5000);
                return;
            }

            if (!window.chrome || !window.chrome.runtime) {
                toast('Chrome extension is not installed or not accessible from this page.', 'error', 5000);
                return;
            }

            chrome.runtime.sendMessage(
                extensionId,
                {
                    action: "START_RECORDING",
                    projectId: flow.projectId || projectId,
                    moduleId: flow.moduleId || moduleId,
                    flowId: flowId,
                    createdBy: user.username,
                    url: projectData.loginUrl,
                    existingFlow: flow,
                    flag: "FLOW"
                },
                (res) => {
                    if (chrome.runtime.lastError) {
                        console.error("Extension message failed:", chrome.runtime.lastError.message);
                        toast('Failed to connect to extension', 'error');
                        return;
                    }
                    console.log("Extension ack:", res);
                    // window.open(projectData.loginUrl, "_blank");
                    setTimeout(() => {
                        toast('window is already open close it to open new one', 'error', 10000);
                    }, 1000);
                }
            );
        } catch (e) {
            toast('Edit flow failed: ' + e.message, 'error');
        }
    };

    window.openStepEditor = function (stepOrder) {
        if (flow.executionStatus === 'RUNNING') {
            toast('Cannot edit step while flow is running!', 'warning');
            return;
        }
        const step = (flow.steps || []).find(s => s.stepOrder === stepOrder);
        if (!step) return;

        openModal(`
            <div class="modal">
                <div class="modal-head">
                    <h2>✏️ Edit Step ${step.stepOrder}: ${esc(step.name || 'Step')}</h2>
                    <button class="modal-close" onclick="closeModal()">✕</button>
                </div>
                <div style="display:flex;flex-direction:column;gap:12px;padding:20px 0">
                    <div>
                        <label class="form-label" style="font-size:12px;color:var(--tx2)">Selector</label>
                        <input id="edit-step-selector" class="inp" value="${esc(step.selector || '')}" placeholder="Selector (e.g. #id, .class)">
                    </div>
                    <div>
                        <label class="form-label" style="font-size:12px;color:var(--tx2)">Value</label>
                        <input id="edit-step-value" class="inp" value="${esc(step.value || '')}" placeholder="Input value">
                    </div>
                    <div>
                        <label class="form-label" style="font-size:12px;color:var(--tx2)">Expected Value</label>
                        <input id="edit-step-expected" class="inp" value="${esc(step.expectedValue || '')}" placeholder="Expected value">
                    </div>
                    <div style="display:flex; gap:12px;">
                        <div style="flex:1">
                            <label class="form-label" style="font-size:12px;color:var(--tx2)">Wait (ms)</label>
                            <input id="edit-step-wait" type="number" class="inp" value="${step.wait || ''}" placeholder="e.g. 5000">
                        </div>
                        <div style="flex:1">
                            <label class="form-label" style="font-size:12px;color:var(--tx2)">Retry Count</label>
                            <input id="edit-step-retry" type="number" class="inp" value="${step.retryCount ?? 0}" placeholder="e.g. 0">
                        </div>
                    </div>
                    <div style="display:flex; gap:20px; margin-top:8px;">
                        <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--tx2); cursor:pointer;">
                            <input type="checkbox" id="edit-step-continue" ${step.continueOnFailure ? 'checked' : ''}>
                            Continue On Failure
                        </label>
                        <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--tx2); cursor:pointer;">
                            <input type="checkbox" id="edit-step-capture" ${step.captureScreenshot !== false ? 'checked' : ''}>
                            Capture Screenshot
                        </label>
                    </div>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
                    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveStep(${step.stepOrder})">Save Changes</button>
                </div>
            </div>
        `);
    };

    window.saveStep = async function (stepOrder) {
        const step = (flow.steps || []).find(s => s.stepOrder === stepOrder);
        if (!step) return;

        step.selector = document.getElementById('edit-step-selector').value;
        step.value = document.getElementById('edit-step-value').value;
        step.expectedValue = document.getElementById('edit-step-expected').value;

        const waitVal = document.getElementById('edit-step-wait').value;
        step.wait = waitVal ? parseInt(waitVal, 10) : null;

        const retryVal = document.getElementById('edit-step-retry').value;
        step.retryCount = retryVal ? parseInt(retryVal, 10) : 0;

        step.continueOnFailure = document.getElementById('edit-step-continue').checked;
        step.captureScreenshot = document.getElementById('edit-step-capture').checked;

        try {
            await api.flows.update(flow.id, flow);
            toast('Step updated successfully', 'success');
            closeModal();
            rebuildMaps();
            renderDetailPanel(step);
            updateStepList();

            // Re-select to show panel properly if closed
            setTimeout(() => {
                if (selectedStepOrder !== stepOrder) {
                    selectStep(stepOrder);
                } else {
                    const card = document.getElementById('step-card-' + stepOrder);
                    if (card) {
                        card.classList.add('selected');
                        renderDetailPanel(step);
                    }
                }
            }, 50);

        } catch(e) {
            toast('Failed to save step: ' + e.message, 'error');
        }
    };

    window.deleteStep = function (stepOrder) {
        if (flow.executionStatus === 'RUNNING') {
            toast('Cannot delete step while flow is running!', 'warning');
            return;
        }
        openModal(`
            <div class="modal">
                <div class="modal-head">
                    <h2>🗑️ Delete Step ${stepOrder}</h2>
                    <button class="modal-close" onclick="closeModal()">✕</button>
                </div>
                <div style="padding: 20px 0;">
                    <p style="margin: 0; font-size: 14px; color: var(--tx2);">Are you sure you want to delete step ${stepOrder}? This action cannot be undone.</p>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
                    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-danger" onclick="confirmDeleteStep(${stepOrder})">Delete</button>
                </div>
            </div>
        `);
    };

    window.confirmDeleteStep = async function (stepOrder) {
        closeModal();
        const stepIndex = (flow.steps || []).findIndex(s => s.stepOrder === stepOrder);
        if (stepIndex === -1) return;

        // Remove the step
        flow.steps.splice(stepIndex, 1);

        // Re-number remaining steps
        flow.steps.sort((a, b) => a.stepOrder - b.stepOrder).forEach((s, idx) => {
            s.stepOrder = idx + 1;
        });

        try {
            await api.flows.update(flow.id, flow);
            toast('Step deleted successfully', 'success');
            
            // Adjust slideshow index if needed
            if (stepSlideshowIndex >= flow.steps.length) {
                stepSlideshowIndex = Math.max(0, flow.steps.length - 1);
            }
            
            selectedStepOrder = null;
            rebuildMaps();
            renderPage();
        } catch(e) {
            toast('Failed to delete step: ' + e.message, 'error');
        }
    };

    // ── BOOT ────────────────────────────────────────────────────────────
    load();
</script>
</body>
</html>
